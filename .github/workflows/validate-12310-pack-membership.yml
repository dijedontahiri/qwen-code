name: Format 12310 candidate

on:
  push:
    branches:
      - validation/12310-pack-membership
    paths:
      - .github/workflows/validate-12310-pack-membership.yml

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 2aa8ae20f8dd4d2d1647c126e0a03e87ef3f0558
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked formatter
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile

      - name: Show canonical formatting diff
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/prettier --experimental-cli --write \
            packages/web-shell/scripts/verify-publish-artifacts.mjs \
            scripts/tests/web-shell-publish-artifacts.test.js
          git diff --no-ext-diff --unified=200 -- \
            packages/web-shell/scripts/verify-publish-artifacts.mjs \
            scripts/tests/web-shell-publish-artifacts.test.js
          test -n "$(git diff --name-only -- packages/web-shell/scripts/verify-publish-artifacts.mjs scripts/tests/web-shell-publish-artifacts.test.js)"
