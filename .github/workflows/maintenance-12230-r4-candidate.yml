name: Validate issue 12230 review fixes

on:
  push:
    branches:
      - validation/12230-r4-candidate
    paths:
      - .github/workflows/maintenance-12230-r4-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: aec6623e184a3d58502f712c8cc6b9e2af54bb77
      PROD_FILE: packages/web-shell/client/daemon/session/DaemonSessionProvider.tsx
      TEST_FILE: packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx
      NO_COLOR: '1'
      EXPECTED_PROD_SHA256: 9e156a50a05beeaef4441980c072c34cbdffaef0a7d47ef85ce79addce6f2c73
      EXPECTED_TEST_SHA256: 4308aab29d13bb1d42c29121e511ef2e21aeb331a666a90db471060a07d95602
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dijedontahiri/qwen-code
          ref: aec6623e184a3d58502f712c8cc6b9e2af54bb77
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --short)"
          node -e "const p=require('./package.json'); if (!p.packageManager.startsWith('pnpm@11.24.0')) throw new Error('unexpected packageManager '+p.packageManager)"
      - name: Install locked dependencies and build workspace
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          npm run build
          git restore --source=HEAD --staged --worktree .
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --short)"
      - name: Reconstruct exact reviewed candidate
        env:
          CANDIDATE_PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_PATCH_GZ_B64" | base64 --decode | gzip -d > "$RUNNER_TEMP/candidate.patch"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          test "$(sha256sum "$PROD_FILE" | cut -d' ' -f1)" = "$EXPECTED_PROD_SHA256"
          test "$(sha256sum "$TEST_FILE" | cut -d' ' -f1)" = "$EXPECTED_TEST_SHA256"
      - name: Run complete affected test file
        run: |
          set -euo pipefail
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx) 2>&1 | tee "$RUNNER_TEMP/affected-file.log"
          grep -F 'Test Files  1 passed (1)' "$RUNNER_TEMP/affected-file.log"
          grep -F 'Tests  411 passed (411)' "$RUNNER_TEMP/affected-file.log"
      - name: Run Web Shell type lint and format checks
        run: |
          set -euo pipefail
          (cd packages/web-shell && npm run typecheck)
          (cd packages/web-shell && npm run lint)
          (cd packages/web-shell && npm run format:check)
      - name: Verify exact candidate scope before repository preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          test "$(sha256sum "$PROD_FILE" | cut -d' ' -f1)" = "$EXPECTED_PROD_SHA256"
          test "$(sha256sum "$TEST_FILE" | cut -d' ' -f1)" = "$EXPECTED_TEST_SHA256"
          test -z "$(git diff --cached --name-only)"
      - name: Run literal repository preflight
        run: |
          set -euo pipefail
          npm run preflight
      - name: Final immutable source and residue audit
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          test "$(sha256sum "$PROD_FILE" | cut -d' ' -f1)" = "$EXPECTED_PROD_SHA256"
          test "$(sha256sum "$TEST_FILE" | cut -d' ' -f1)" = "$EXPECTED_TEST_SHA256"
          test -z "$(git diff --cached --name-only)"
