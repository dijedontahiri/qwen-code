name: Validate issue 12185 web-shell package fix

on:
  push:
    branches:
      - validation/12185-web-shell-package-20260918

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: bd24d53b9392c49d8e8ac94d1af03294fe3a855d
      BASE_SHA: e596a410bbd58313b6db069eed1cbb33bd3dbd8f
    steps:
      - name: Checkout exact contribution head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Verify exact head and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          printf '%s\n' \
            '.qwen/e2e-tests/2026-09-18-web-shell-package-artifacts.md' \
            'packages/web-shell/build-boundary.ts' \
            'packages/web-shell/client/build-boundary.test.ts' \
            'packages/web-shell/package.json' \
            'packages/web-shell/scripts/rewrite-declaration-aliases.mjs' \
            'packages/web-shell/scripts/verify-package.mjs' \
            'packages/web-shell/vite.lib.config.ts' > /tmp/expected-files
          git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install dependencies
        run: npm ci

      - name: Prove baseline failure modes
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:packages/web-shell/vite.lib.config.ts" > /tmp/baseline-vite-lib.ts
          for dependency in \
            '@xterm/xterm' \
            '@xterm/addon-fit' \
            '@tanstack/react-table' \
            '@tanstack/react-virtual' \
            'fzf' \
            '@modelcontextprotocol/ext-apps'; do
            if grep -Fq "'$dependency'" /tmp/baseline-vite-lib.ts; then
              echo "baseline unexpectedly externalizes $dependency" >&2
              exit 1
            fi
          done

          rm -rf packages/web-shell/dist
          (
            cd packages/web-shell
            npx vite build
            npx vite build --config vite.lib.config.ts
            npx vite build --config vite.lib.config.ts --mode transcript
            npx tsc -p tsconfig.lib.json
          )
          grep -R -n -E "['\"]@/" packages/web-shell/dist/types > /tmp/baseline-aliases
          test -s /tmp/baseline-aliases
          if node packages/web-shell/scripts/verify-package.mjs; then
            echo 'publish verifier should fail before declaration aliases are rewritten' >&2
            exit 1
          fi

      - name: Verify fixed package artifacts and boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node packages/web-shell/scripts/rewrite-declaration-aliases.mjs
          node packages/web-shell/scripts/verify-package.mjs
          npm run test:ci --workspace=@qwen-code/web-shell -- build-boundary.test.ts
          npm run build --workspace=@qwen-code/web-shell
          npm pack --workspace=@qwen-code/web-shell --dry-run --json > /tmp/web-shell-pack.json
          node -e "const p=require('/tmp/web-shell-pack.json'); if(!Array.isArray(p)||!p[0]?.files?.length) process.exit(1)"

      - name: Full repository preflight
        run: npm run preflight

      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          test -z "$(git status --porcelain)"
