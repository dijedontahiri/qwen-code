name: Validate issue 12230 current-main candidate

on:
  push:
    branches:
      - validation/12230-current-main-r3
    paths:
      - .github/workflows/maintenance-12230-current-main-r3.yml

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 1ac097163389b7b85b21bf74c396052fc2fcc59f
      TEST_NAME: withholds the live settlement while a journal repair targets the same prompt
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QwenLM/qwen-code
          ref: 1ac097163389b7b85b21bf74c396052fc2fcc59f
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
      - name: Install and build prerequisites
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only > "$RUNNER_TEMP/install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/install.log"; exit 1; }
          npm run build
          git restore --source=HEAD --staged --worktree .
          test -z "$(git status --short)"
      - name: Prove desired settlement fails on current baseline
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx';
          let s = fs.readFileSync(p, 'utf8');
          const old = "    // Current behavior, not desired, pinned deliberately: the replay publish is\n    // gated on local admission and this prompt was never admitted, so the\n    // settlement the live path withheld is never re-published (#12230).\n    expect(settlements).toEqual([]);\n";
          const desired = "    expect(settlements).toEqual([\n      {\n        sessionId: 'session-settle-repair',\n        promptId: 'prompt-live',\n        outcome: 'completed',\n        stopReason: 'end_turn',\n      },\n    ]);\n";
          if (s.split(old).length !== 2) throw new Error('baseline oracle anchor mismatch');
          fs.writeFileSync(p, s.replace(old, desired));
          NODE
          set +e
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$TEST_NAME") > "$RUNNER_TEMP/baseline.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "$TEST_NAME" "$RUNNER_TEMP/baseline.log"
          grep -F 'expected [] to deeply equal' "$RUNNER_TEMP/baseline.log"
          git restore --source=HEAD --staged --worktree packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx
          test -z "$(git status --short)"
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-12230-current-baseline
          path: ${{ runner.temp }}/baseline.log
          if-no-files-found: ignore
          retention-days: 7

  candidate:
    if: github.repository == 'dijedontahiri/qwen-code'
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BASE_SHA: 1ac097163389b7b85b21bf74c396052fc2fcc59f
      PRODUCT_SHA: b7367a0d04cb545b738b1070b7445a12d4e8f6f5
      TEST_NAME: withholds the live settlement while a journal repair targets the same prompt
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dijedontahiri/qwen-code
          ref: b7367a0d04cb545b738b1070b7445a12d4e8f6f5
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
      - name: Verify immutable product identity and scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected=$'packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx\npackages/web-shell/client/daemon/session/DaemonSessionProvider.tsx'
          test "$(git diff --name-only "$BASE_SHA"...HEAD | sort)" = "$expected"
          git diff --check "$BASE_SHA"...HEAD
          test -z "$(git status --short)"
      - name: Install and build prerequisites
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only > "$RUNNER_TEMP/install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/install.log"; exit 1; }
          npm run build
          git restore --source=HEAD --staged --worktree .
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --short)"
      - name: Focused regression and full provider suite
        run: |
          set -euo pipefail
          cd packages/web-shell
          npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$TEST_NAME"
          npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx
      - name: Web Shell type lint and format gates
        run: |
          set -euo pipefail
          cd packages/web-shell
          npm run typecheck
          npx eslint client/daemon/session/DaemonSessionProvider.tsx client/daemon/session/DaemonSessionProvider.test.tsx --max-warnings 0
          npx prettier --experimental-cli --check client/daemon/session/DaemonSessionProvider.tsx client/daemon/session/DaemonSessionProvider.test.tsx
      - name: Literal repository preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run preflight 2>&1 | tee "$RUNNER_TEMP/preflight.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/preflight.status"
          exit "$rc"
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-12230-current-main-r3
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/preflight.log
            ${{ runner.temp }}/preflight.status
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit immutable product source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
