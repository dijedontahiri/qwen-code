name: Inspect PR 12191 merge blockers
on:
  push:
    branches: [validation/12191-merge-audit-20260920-r2]
    paths: [.github/workflows/maintenance-12191-merge-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: 3ec369460d5e667289e297961457dd259dba42a7
      UPSTREAM_SHA: be9ed41afd2f59492cd372fbe1d52b653e42f3b8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 3ec369460d5e667289e297961457dd259dba42a7
          fetch-depth: 500
          persist-credentials: false
      - name: Audit public PR review and CI state without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api graphql -f query='query { search(query: "is:pr is:open author:dijedontahiri -user:dijedontahiri", type: ISSUE, first: 100) { issueCount nodes { ... on PullRequest { number url title isDraft mergeable reviewDecision headRefOid repository { nameWithOwner } reviews(last: 1) { nodes { state submittedAt author { login } body } } commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes { ... on CheckRun { name status conclusion detailsUrl } ... on StatusContext { context state description } } pageInfo { hasNextPage } } } } } } } } } }' --jq '.data.search | {count: .issueCount, prs: [.nodes[] | {repo: .repository.nameWithOwner, number, title, isDraft, mergeable, reviewDecision, head: .headRefOid, latestReview: .reviews.nodes, checks: [.commits.nodes[].commit.statusCheckRollup.contexts.nodes[]? | select((.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL") and (.state != "SUCCESS"))]}]}'
      - name: Inspect exact merge and preserve all conflict evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git fetch --no-tags --depth=500 https://github.com/QwenLM/qwen-code.git "$UPSTREAM_SHA"
          echo "MERGE_BASE=$(git merge-base HEAD "$UPSTREAM_SHA")"
          echo '=== Instruction files ==='
          git ls-tree -r --name-only "$UPSTREAM_SHA" | grep -E '(^|/)(AGENTS|QWEN|GEMINI)\.md$|\.qwen/skills/bugfix/SKILL.md|pull_request_template.md|SECURITY.md' || true
          echo '=== Product delta ==='
          git diff --stat "$(git merge-base HEAD "$UPSTREAM_SHA")" HEAD
          echo '=== Relevant upstream history ==='
          git log -8 --format='%h %s' "$UPSTREAM_SHA" -- packages/channels/feishu/src/adapter.test.ts packages/web-shell/vite.lib.config.ts packages/web-templates/scripts
          git config user.name 'Dijedon'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          set +e
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$UPSTREAM_SHA" > "$RUNNER_TEMP/merge.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/merge.log"
          echo "MERGE_EXIT=$rc"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          echo '=== Conflicted paths ==='
          cat "$RUNNER_TEMP/conflicts.txt"
          python3 - "$RUNNER_TEMP/conflicts.txt" <<'PY'
          import pathlib, sys
          for name in pathlib.Path(sys.argv[1]).read_text().splitlines():
              print('\n=== CONFLICT: ' + name + ' ===')
              lines = pathlib.Path(name).read_text(errors='replace').splitlines()
              selected = set()
              active = False
              for i,line in enumerate(lines):
                  if line.startswith('<<<<<<<'):
                      active = True
                      selected.update(range(max(0,i-8),i))
                  if active: selected.add(i)
                  if line.startswith('>>>>>>>'):
                      active = False
                      selected.update(range(i+1,min(len(lines),i+9)))
              for i in sorted(selected)[:300]: print(f'{i+1}: {lines[i]}')
          PY
          echo '=== Current upstream preflight and Feishu fixture ==='
          git show "$UPSTREAM_SHA:package.json" | python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps({"packageManager":p.get("packageManager"),"scripts":{k:v for k,v in p["scripts"].items() if k in ("preflight","build","clean","format","format:check","typecheck","test:ci")}},indent=2))'
          git show "$UPSTREAM_SHA:packages/channels/feishu/src/adapter.test.ts" | grep -A 55 -B 2 "it('dispatches both media and ordinary text'"
          git -c core.hooksPath=/dev/null merge --abort
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo 'Read-only rehearsal complete: no product branch or upstream metadata changed.'
