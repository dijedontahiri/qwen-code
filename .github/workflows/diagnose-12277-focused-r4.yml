name: Diagnose issue 12277 focused tests r4

on:
  push:
    branches:
      - diagnostic/12277-bb006-focused-r4
    paths:
      - .github/workflows/diagnose-12277-focused-r4.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PRODUCT_SHA: bb0065646d1296bac234512f0d344a7bef8af864
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          node --version
          npm --version
          df -h .
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - id: lifecycle
        name: Probe lifecycle serialization
        continue-on-error: true
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts -t 'serializes lifecycle changes and fully revokes state on disable'
      - id: ordering
        name: Probe in-flight disable ordering
        continue-on-error: true
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts -t 'orders disable after an in-flight enable'
      - id: target
        name: Probe target validation
        continue-on-error: true
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts -t 'validates target before committing listener state'
      - id: sleep
        name: Probe sleep inhibition status
        continue-on-error: true
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts -t 'reports sleep inhibition only when the inhibitor is running'
      - id: fallback
        name: Probe busy preferred port fallback
        continue-on-error: true
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts -t 'falls back to a free LAN port when the preferred port is in use'
      - name: FAILURE lifecycle serialization
        if: always() && steps.lifecycle.outcome != 'success'
        run: exit 1
      - name: FAILURE in-flight disable ordering
        if: always() && steps.ordering.outcome != 'success'
        run: exit 1
      - name: FAILURE target validation
        if: always() && steps.target.outcome != 'success'
        run: exit 1
      - name: FAILURE sleep inhibition status
        if: always() && steps.sleep.outcome != 'success'
        run: exit 1
      - name: FAILURE busy preferred port fallback
        if: always() && steps.fallback.outcome != 'success'
        run: exit 1
      - id: audit
        name: Audit immutable product source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Require all focused probes and audit
        if: always()
        env:
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          ORDERING: ${{ steps.ordering.outcome }}
          TARGET: ${{ steps.target.outcome }}
          SLEEP: ${{ steps.sleep.outcome }}
          FALLBACK: ${{ steps.fallback.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          printf 'lifecycle=%s ordering=%s target=%s sleep=%s fallback=%s audit=%s\n' "$LIFECYCLE" "$ORDERING" "$TARGET" "$SLEEP" "$FALLBACK" "$AUDIT"
          test "$LIFECYCLE" = success
          test "$ORDERING" = success
          test "$TARGET" = success
          test "$SLEEP" = success
          test "$FALLBACK" = success
          test "$AUDIT" = success
