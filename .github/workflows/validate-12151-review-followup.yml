name: Issue 12151 review follow-up validation
on:
  push:
    branches: [validation/12151-review-followup]
permissions:
  contents: read
env:
  CI: 'true'
  CANDIDATE_SHA: 8aa4768e93bf030dbfa6e8ad2f30240818f2762e
  BASE_SHA: f2e653b5e64c2a0be4dcd64d75f00c167312ba04
jobs:
  preflight-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 8aa4768e93bf030dbfa6e8ad2f30240818f2762e
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Verify exact contribution and five-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf '%s\n' docs/developers/development/_meta.ts docs/developers/development/gitignore-cache.md integration-tests/glob-ignore-cache.test.ts packages/core/src/utils/git-ignore-parser-cache.test.ts packages/core/src/utils/gitIgnoreParser.ts | sort > "$RUNNER_TEMP/expected-files.txt"
          git diff --name-only "$BASE_SHA" HEAD | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git diff --check "$BASE_SHA" HEAD
          node --version
          npm --version
          free -m
      - name: Bootstrap dependencies required by the clean script
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full repository preflight
        run: |
          set -euo pipefail
          npm run preflight 2>&1 | tee "$RUNNER_TEMP/qwen-12151-review-preflight.log"
      - name: Focused parser regressions after build
        run: npm test --workspace @qwen-code/qwen-code-core -- src/utils/gitIgnoreParser.test.ts src/utils/git-ignore-parser-cache.test.ts
      - name: Build the actual CLI bundle
        run: |
          set -euo pipefail
          npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen-12151-review-bundle.log"
      - name: Real CLI sparse-glob E2E without retries
        env:
          QWEN_SANDBOX: 'false'
          QWEN_DEBUG_LOG_FILE: '0'
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run --root ./integration-tests glob-ignore-cache.test.ts --retry=0 2>&1 | tee "$RUNNER_TEMP/qwen-12151-review-cli-e2e.log"
      - name: Verify unchanged tested head and clean worktree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'Exact contribution tested: %s\nBase: %s\nFull preflight, focused regressions, and real CLI E2E passed.\n' "$CANDIDATE_SHA" "$BASE_SHA" | tee "$RUNNER_TEMP/qwen-12151-review-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-12151-review-followup-validation
          path: |
            ${{ runner.temp }}/qwen-12151-review-*.log
            ${{ runner.temp }}/qwen-12151-review-summary.txt
          retention-days: 14
          if-no-files-found: warn
