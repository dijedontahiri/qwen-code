name: Validate issue 12185 contribution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/12185-web-shell-package-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Verify contribution scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/QwenLM/qwen-code.git main
          BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Validating contribution against upstream merge base $BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          printf '%s\n' \
            '.qwen/e2e-tests/2026-09-18-web-shell-package-artifacts.md' \
            'packages/web-shell/build-boundary.ts' \
            'packages/web-shell/client/build-boundary.test.ts' \
            'packages/web-shell/package.json' \
            'packages/web-shell/scripts/rewrite-declaration-aliases.mjs' \
            'packages/web-shell/scripts/verify-package.mjs' \
            'packages/web-shell/vite.lib.config.ts' > /tmp/expected-files
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install repository dependencies
        run: node scripts/setup-worktree.js

      - name: Build workspace prerequisites
        run: npm run build

      - name: Prove declaration baseline fails before rewrite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/web-shell/dist
          (
            cd packages/web-shell
            npx tsc -p tsconfig.lib.json
          )
          grep -R -n -E "\\b(from|import[[:space:]]*\\(|require[[:space:]]*\\()[[:space:]]*['\"]@/" packages/web-shell/dist/types > /tmp/baseline-aliases
          test -s /tmp/baseline-aliases
          if node packages/web-shell/scripts/verify-package.mjs; then
            echo 'publish verifier should fail before declaration aliases are rewritten' >&2
            exit 1
          fi

      - name: Verify fixed package artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace=@qwen-code/web-shell
          node packages/web-shell/scripts/verify-package.mjs
          npm run test:ci --workspace=@qwen-code/web-shell -- build-boundary.test.ts
          npm pack --workspace=@qwen-code/web-shell --dry-run --json > /tmp/web-shell-pack.json
          node -e "const p=require('/tmp/web-shell-pack.json'); if(!Array.isArray(p)||!p[0]?.files?.length) process.exit(1)"

      - name: Full repository preflight
        run: npm run preflight

      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD
          test -z "$(git status --porcelain)"
