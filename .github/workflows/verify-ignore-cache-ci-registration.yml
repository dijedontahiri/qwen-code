name: Verify ignore cache review repairs
on:
  push:
    branches: [validate/ignore-cache-ci-registration-20260918]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      QWEN_SANDBOX: 'false'
      QWEN_DEBUG_LOG_FILE: '0'
      PRODUCT_SHA: 67347844f529b3ddda4e5816cfc9e7a101007c78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67347844f529b3ddda4e5816cfc9e7a101007c78
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - name: Verify immutable source
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Install dependencies
        run: npm ci
      - name: Focused parser suites
        working-directory: packages/core
        run: node ../../node_modules/vitest/vitest.mjs run src/utils/gitIgnoreParser.test.ts src/utils/git-ignore-parser-cache.test.ts --maxWorkers=1
      - name: Prove exclude-snapshot regression catches a rollover reload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/utils/gitIgnoreParser.ts')
          s = p.read_text()
          needle = '    this.chainIgnorers.clear();\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, needle + '    this.globalPatterns = undefined;\n'))
          PY
          set +e
          (cd packages/core && node ../../node_modules/vitest/vitest.mjs run src/utils/git-ignore-parser-cache.test.ts --maxWorkers=1 -t 'keeps the .git/info/exclude snapshot across matcher rollover') > /tmp/negative-control.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'keeps the .git/info/exclude snapshot across matcher rollover' /tmp/negative-control.log
          grep -F 'expected false to be true' /tmp/negative-control.log
          git checkout -- packages/core/src/utils/gitIgnoreParser.ts
          (cd packages/core && node ../../node_modules/vitest/vitest.mjs run src/utils/git-ignore-parser-cache.test.ts --maxWorkers=1 -t 'keeps the .git/info/exclude snapshot across matcher rollover')
      - name: Verify no-key CI registration guard
        run: npm run test:scripts -- scripts/tests/no-ak-integration-ci.test.js
      - name: Build and bundle
        run: |
          npm run build
          npm run bundle
      - name: Bundled CLI ignore semantics
        run: node node_modules/vitest/vitest.mjs run --root ./integration-tests cli/glob-ignore-cache.test.ts --retry=0
      - name: Exercise actual pull-request no-key script registration
        run: |
          npm run test:integration:no-ak:sandbox:none -- --retry=0 --testNamePattern='Glob ignore-cache rollover' --reporter=default --reporter=json --outputFile=/tmp/no-key-result.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/no-key-result.json', 'utf8'));
          const file = result.testResults.find((entry) => entry.name.endsWith('/cli/glob-ignore-cache.test.ts'));
          assert(file, 'pull-request no-key script must collect cli/glob-ignore-cache.test.ts');
          assert.equal(file.assertionResults.length, 1);
          assert.equal(file.assertionResults[0].status, 'passed');
          assert.equal(result.numFailedTests, 0);
          JS
      - name: Full preflight
        run: npm run preflight
      - name: Final exact-source audit
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
