name: Publish issue 12230 exact validated candidate r6

on:
  push:
    branches:
      - automation/12230-finalizer-20260921
    paths:
      - .github/workflows/maintenance-12230-reconcile-r5.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALIDATION_RUN: '35954932633'
      VALIDATOR_SHA: d4d57a7336f77c2fe25d85736d77d4f9a7f17605
      BASE_SHA: e39d2390fc633107bfb8bdb7d8c9fbbf5a137cbd
      ARTIFACT_ID: '10792002714'
      ARTIFACT_SHA256: d681a19be87b48cbdea580a16955016b1b19aa1acf350e68893dc18adc9015a7
      PRODUCT_BRANCH: fix/12230-live-journal-settlement-r4
      TARGET1: packages/web-shell/client/daemon/session/DaemonSessionProvider.tsx
      TARGET2: packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Verify successful immutable validation evidence
        shell: bash
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/run.json"
          artifact_json="$RUNNER_TEMP/artifact.json"
          gh api "repos/dijedontahiri/qwen-code/actions/runs/$VALIDATION_RUN" > "$run_json"
          test "$(jq -r .head_sha "$run_json")" = "$VALIDATOR_SHA"
          test "$(jq -r .run_attempt "$run_json")" = '1'
          test "$(jq -r .status "$run_json")" = 'completed'
          test "$(jq -r .conclusion "$run_json")" = 'success'
          gh api "repos/dijedontahiri/qwen-code/actions/artifacts/$ARTIFACT_ID" > "$artifact_json"
          test "$(jq -r .workflow_run.id "$artifact_json")" = "$VALIDATION_RUN"
          test "$(jq -r .workflow_run.head_sha "$artifact_json")" = "$VALIDATOR_SHA"
          test "$(jq -r .expired "$artifact_json")" = 'false'
          test "$(jq -r .digest "$artifact_json")" = "sha256:$ARTIFACT_SHA256"
          zip="$RUNNER_TEMP/evidence.zip"
          gh api -H 'Accept: application/vnd.github+json' "repos/dijedontahiri/qwen-code/actions/artifacts/$ARTIFACT_ID/zip" > "$zip"
          echo "$ARTIFACT_SHA256  $zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/evidence"
          unzip -q "$zip" -d "$RUNNER_TEMP/evidence"
          test -s "$RUNNER_TEMP/evidence/candidate.patch"
          cmp "$RUNNER_TEMP/evidence/candidate-sha256.txt" "$RUNNER_TEMP/evidence/final-sha256.txt"
      - name: Reconstruct exact verified product tree and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/QwenLM/qwen-code.git
          git fetch --no-tags upstream "$BASE_SHA" main
          test "$(git cat-file -t "$BASE_SHA")" = commit
          git merge-base --is-ancestor "$BASE_SHA" upstream/main
          test -z "$(git diff --name-only "$BASE_SHA" upstream/main -- "$TARGET1" "$TARGET2")"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --short)"
          git apply --index --check "$RUNNER_TEMP/evidence/candidate.patch"
          git apply --index "$RUNNER_TEMP/evidence/candidate.patch"
          git diff --cached --check
          expected=$'packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx\npackages/web-shell/client/daemon/session/DaemonSessionProvider.tsx'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          sha256sum "$TARGET1" "$TARGET2" > "$RUNNER_TEMP/applied-sha256.txt"
          diff -u "$RUNNER_TEMP/evidence/final-sha256.txt" "$RUNNER_TEMP/applied-sha256.txt"
          git config user.name 'OpenAI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web-shell): preserve settlement through journal repair'
          candidate=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- . ':!.github')" || true
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing product branch $PRODUCT_BRANCH" >&2
            exit 1
          fi
          git push origin HEAD:"refs/heads/$PRODUCT_BRANCH"
          printf 'candidate=%s\n' "$candidate"
