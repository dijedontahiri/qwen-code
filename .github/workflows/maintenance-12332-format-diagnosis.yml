name: Diagnose issue 12332 formatting
on:
  push:
    branches: [validation/12332-format-diagnosis]
    paths: [.github/workflows/maintenance-12332-format-diagnosis.yml]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file:
          - packages/web-shell/scripts/verify-publish-artifacts.mjs
          - scripts/tests/web-shell-publish-artifacts.test.js
    name: format ${{ matrix.file }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 48390309b9cfe41195793503af9235d38646ba10
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
      - name: Verify immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '48390309b9cfe41195793503af9235d38646ba10'
          git diff --exit-code
          git diff --cached --exit-code
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile >/dev/null
      - name: Check one file
        run: node_modules/.bin/prettier --check "${{ matrix.file }}"
      - name: Audit source residue
        if: always()
        run: |
          git restore --source=HEAD --staged --worktree .
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
