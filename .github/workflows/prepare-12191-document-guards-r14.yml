name: Prepare PR 12191 document guards

on:
  push:
    branches: [validation/12191-document-guards-r14]
    paths: [.github/workflows/prepare-12191-document-guards-r14.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SOURCE_SHA: 9efce16d482095b24d155513c0e6e513a12bfbdb
      TARGET_FILE: packages/web-templates/src/export-html/build.mjs
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply review repairs in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          cp "$TARGET_FILE" /tmp/build.before.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/web-templates/src/export-html/build.mjs')
          source = path.read_text()
          old_budget = """// Last measured at 1,833,894 bytes of JS with 2,302,905 bytes of CSS moved
// out, by the Lint & Static lane on this branch. Before the split that lane
// measured the combined bundle at 4,133,282 bytes on main at c3023b3e6d — the
// measurement #11372 raised these two constants for, and which this branch
// supersedes because the CSS it counted is no longer in the JS. Keep the
// warning close to the measurement and the hard ceiling close above it: a cap
// left far above the measurement is a ratchet with enough slack for a whole
// dependency family to come back unnoticed.
const DOCUMENT_RUNTIME_WARNING_BYTES = 1_870_000;
const MAX_DOCUMENT_RUNTIME_BYTES = 1_930_000;
"""
          new_budget = """// Measured at 1,806,361 bytes of JS on the manifest-externalized document
// build with the document MCP bridge substitution engaged. A review control
// with that substitution removed measured 2,111,566 bytes. Keep the warning
// close to the healthy measurement and the hard ceiling close above it: a cap
// left far above the measurement is a ratchet with enough slack for a whole
// dependency family to come back unnoticed.
const DOCUMENT_RUNTIME_WARNING_BYTES = 1_830_000;
const MAX_DOCUMENT_RUNTIME_BYTES = 1_870_000;
"""
          if source.count(old_budget) != 1:
              raise SystemExit('budget block drifted')
          source = source.replace(old_budget, new_budget)
          needle = "const documentInputs = documentBuildResult.metafile.inputs;\n"
          guard = """const documentInputs = documentBuildResult.metafile.inputs;
const documentMcpBridgeStubEngaged = Object.keys(documentInputs).some((input) =>
  input
    .replaceAll('\\\\', '/')
    .endsWith('/document-mcp-app-bridge-stub.ts'),
);
if (!documentMcpBridgeStubEngaged) {
  throw new Error(
    'Document export did not use document-mcp-app-bridge-stub.ts; the real ' +
      'interactive MCP App bridge may have been bundled into the transcript entry.',
  );
}
"""
          if source.count(needle) != 1:
              raise SystemExit('documentInputs declaration drifted')
          source = source.replace(needle, guard)
          path.write_text(source)
          PY
          git diff --check -- "$TARGET_FILE"
          git diff -- "$TARGET_FILE" > /tmp/document-guards.patch
          test -s /tmp/document-guards.patch

      - name: Check formatting
        run: npx prettier --experimental-cli --check "$TARGET_FILE"

      - name: Build Web Shell
        run: npm run build --workspace @qwen-code/web-shell

      - name: Build document renderer with tightened guard
        shell: bash
        run: |
          set -euo pipefail
          node packages/web-templates/src/export-html/build.mjs 2>&1 | tee /tmp/document-build.log
          grep -F 'Document export renderer JS is 1806361 bytes' /tmp/document-build.log

      - name: Prove the MCP substitution engagement guard catches resolver loss
        shell: bash
        run: |
          set -euo pipefail
          cp "$TARGET_FILE" /tmp/build.patched.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/web-templates/src/export-html/build.mjs')
          source = path.read_text()
          block = """    build.onResolve(
      { filter: /^@modelcontextprotocol\\/ext-apps\\/app-bridge$/ },
      () => ({ path: documentMcpAppBridgeStub }),
    );
"""
          if source.count(block) != 1:
              raise SystemExit('MCP resolver block drifted')
          path.write_text(source.replace(block, ''))
          PY
          set +e
          node packages/web-templates/src/export-html/build.mjs > /tmp/mcp-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'Document export did not use document-mcp-app-bridge-stub.ts' /tmp/mcp-negative.log
          cp /tmp/build.patched.mjs "$TARGET_FILE"
          cmp "$TARGET_FILE" /tmp/build.patched.mjs

      - name: Final patched-file checks
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --experimental-cli --check "$TARGET_FILE"
          git diff --check -- "$TARGET_FILE"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload exact prepared file and patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr12191-document-guards-${{ env.SOURCE_SHA }}
          path: |
            packages/web-templates/src/export-html/build.mjs
            /tmp/document-guards.patch
            /tmp/document-build.log
            /tmp/mcp-negative.log
          if-no-files-found: error
          retention-days: 1
