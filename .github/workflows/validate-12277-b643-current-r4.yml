name: Validate issue 12277 current exact source r4

on:
  push:
    branches:
      - validation/12277-b6437572-current-r4
    paths:
      - .github/workflows/validate-12277-b643-current-r4.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PRODUCT_SHA: b6437572385d29cd24ed5063c2edbdedcbdd965c
      BASE_SHA: e75b8e53b033d38687f5d5cdfb7b620db3808218
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: b6437572385d29cd24ed5063c2edbdedcbdd965c
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify exact source and issue scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$PRODUCT_SHA"
          actual=$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" | sort)
          expected=$(printf '%s\n' \
            packages/cli/src/serve/local-control/service.test.ts \
            packages/cli/src/serve/local-control/service.ts | sort)
          test "$actual" = "$expected"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          node --version
          corepack --version
          df -h .

      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace prerequisites
        run: npm run build

      - name: Prove baseline rejects the busy preferred LAN port
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$BASE_SHA" -- packages/cli/src/serve/local-control/service.ts
          set +e
          npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts \
            -t 'falls back to a free LAN port when the preferred port is in use' \
            2>&1 | tee "$RUNNER_TEMP/12277-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          git checkout "$PRODUCT_SHA" -- packages/cli/src/serve/local-control/service.ts
          test "$status" -ne 0
          grep -F 'falls back to a free LAN port when the preferred port is in use' "$RUNNER_TEMP/12277-baseline.log"
          grep -F 'EADDRINUSE' "$RUNNER_TEMP/12277-baseline.log"
          test -z "$(git diff --name-only "$PRODUCT_SHA" -- packages/cli/src/serve/local-control/service.ts)"

      - name: Run focused Local Control regression
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts

      - name: Check changed-file formatting
        run: |
          node_modules/.bin/prettier --experimental-cli --check \
            packages/cli/src/serve/local-control/service.ts \
            packages/cli/src/serve/local-control/service.test.ts

      - name: Run literal repository preflight
        run: npm run preflight

      - name: Final immutable-source audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$BASE_SHA" "$PRODUCT_SHA"
