name: Validate #12191 shell-utils baseline

on:
  push:
    branches:
      - validation/12191-shell-utils-baseline

permissions:
  contents: read

jobs:
  compare-shell-utils:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-parent
            sha: 6326004548462dd5074c91bb4aac05faf7a038a4
          - label: candidate
            sha: 1e4ecb66ed14f47e5431bd1b9b0d208b03f0ef36
    name: ${{ matrix.label }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run exact failing shell-utils test three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Focused attempt ${attempt} on ${{ matrix.label }} (${{ matrix.sha }})"
            npm run test --workspace @qwen-code/qwen-code-core -- src/utils/shell-utils.test.ts -t "should handle newlines after the dollar sign"
          done

      - name: Run complete shell-utils regression file
        run: npm run test --workspace @qwen-code/qwen-code-core -- src/utils/shell-utils.test.ts

      - name: Audit immutable source after tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          if git status --porcelain --untracked-files=all | grep -v '^?? node_modules/' | grep -q .; then
            echo "Unexpected non-node_modules untracked files:" >&2
            git status --short --untracked-files=all | grep -v '^?? node_modules/' >&2
            exit 1
          fi
