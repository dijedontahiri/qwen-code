name: Validate 7002 Review Fixes

on:
  push:
    branches:
      - validation/7002-review-20260919

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 13725ddb5fa7dbdc5909322b4762ae556a193112
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "13725ddb5fa7dbdc5909322b4762ae556a193112"
          test "$(git rev-parse HEAD^)" = "0647a394c9a467e6a542a2fc686e2043052456b8"
          git diff --check HEAD^
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install dependencies
        run: node scripts/setup-worktree.js

      - name: Build workspace prerequisites
        run: npm run build

      - name: Focused installer tests
        run: npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js scripts/tests/install-script.test.js

      - name: Prove allow-path assertions do not pin downloader status
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/installation/install-qwen-standalone.sh /tmp/installer.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/installation/install-qwen-standalone.sh')
          s = p.read_text()
          old = 'log_warning "Failed to download standalone archive."\n        return 1'
          new = 'log_warning "Failed to download standalone archive."\n        return 2'
          if old not in s:
              raise SystemExit('download failure branch not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js
          git show HEAD^:scripts/tests/install-glibc-preflight.test.js > /tmp/parent-test.js
          cp scripts/tests/install-glibc-preflight.test.js /tmp/candidate-test.js
          cp /tmp/parent-test.js scripts/tests/install-glibc-preflight.test.js
          set +e
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js >/tmp/parent-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'expected 2 to be 1' /tmp/parent-negative.log
          mv /tmp/candidate-test.js scripts/tests/install-glibc-preflight.test.js
          mv /tmp/installer.sh scripts/installation/install-qwen-standalone.sh

      - name: Prove distro banner reaches the unified ldd fixture
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/installation/install-qwen-standalone.sh /tmp/installer.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/installation/install-qwen-standalone.sh')
          s = p.read_text()
          old = 'NR == 1 && /GNU libc|GNU C Library|GLIBC/ {'
          new = 'NR == 1 && /GNU libc|GNU C Library/ {'
          if old not in s:
              raise SystemExit('ldd identity matcher not found')
          p.write_text(s.replace(old, new, 1))
          PY
          set +e
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js >/tmp/banner-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'rejects an old distro-branded glibc banner via ldd' /tmp/banner-negative.log
          mv /tmp/installer.sh scripts/installation/install-qwen-standalone.sh

      - name: Formatting and shell checks
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --check scripts/tests/install-glibc-preflight.test.js
          node scripts/lint.js --shellcheck

      - name: Full repository preflight
        run: npm run preflight

      - name: Final source audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "13725ddb5fa7dbdc5909322b4762ae556a193112"
          git diff --check HEAD^
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --porcelain --untracked-files=all)"
