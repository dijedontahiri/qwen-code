name: OSS follow-up read-only diagnostics

on:
  push:
    branches: [validation/oss-followup-20260919-audit]
    paths: [.github/workflows/oss-followup-readonly.yml]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  audit:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read current PR checks and extract existing failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import re
          import subprocess

          jobs = [
              ('dijedontahiri/qwen-code', 105930812521),
              ('dijedontahiri/qwen-code', 105916960256),
              ('strapi/strapi', 105660843251),
          ]
          read_count = 0
          for repo, job in jobs:
              print('READ_EXISTING_JOB', repo, job, flush=True)
              result = subprocess.run(['gh', 'api', '--allow-escape-sequences', f'repos/{repo}/actions/jobs/{job}/logs'], capture_output=True, timeout=90)
              if result.returncode:
                  print('READ_ERROR', result.stderr.decode(errors='replace')[-600:])
                  continue
              text = re.sub(r'\x1b\[[0-9;]*[a-zA-Z]', '', result.stdout.decode('utf-8', errors='replace'))
              lines = [re.sub(r'^\d{4}-\d\d-\d\dT\S+\s+', '', line) for line in text.splitlines()]
              if job == 105930812521:
                  indices = [i for i, line in enumerate(lines) if '[warn]' in line or 'format=failure' in line]
              else:
                  indices = [i for i, line in enumerate(lines) if re.search(r'^\s*FAIL\s|AssertionError|Tests\s+.*failed|Test Files\s+.*failed|TimeoutError|Timed out|\) \[.*\].*\.(spec|test)\.|\[error\].*(Error|failed)', line)][-12:]
              selected = set()
              for index in indices:
                  selected.update(range(max(0, index-3), min(len(lines), index+19)))
              if not selected:
                  selected.update(range(max(0, len(lines)-60), len(lines)))
              output = '\n'.join(lines[i] for i in sorted(selected))
              print(output[-14000:])
              read_count += 1
          print(f'LOG_READ_COUNT {read_count}/{len(jobs)}; no test or product changes.')
          if read_count != len(jobs):
              raise SystemExit(1)
          PYTHON
