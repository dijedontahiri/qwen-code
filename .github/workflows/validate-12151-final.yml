name: Issue 12151 exact-head validation
on:
  push:
    branches: [validation/12151-final]
permissions:
  contents: read
env:
  CI: 'true'
  CANDIDATE_SHA: 2d1b9b2509666a0b9ed6b8c005238b6f40391447
  BASE_SHA: 455f3d07953ff3c2fe2fbd4f0cb06d98c03af169
jobs:
  preflight-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 2d1b9b2509666a0b9ed6b8c005238b6f40391447
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Verify exact contribution and four-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf '%s\n' docs/developers/development/gitignore-cache.md integration-tests/glob-ignore-cache.test.ts packages/core/src/utils/git-ignore-parser-cache.test.ts packages/core/src/utils/gitIgnoreParser.ts | sort > "$RUNNER_TEMP/expected-files.txt"
          git diff --name-only "$BASE_SHA" HEAD | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git diff --check "$BASE_SHA" HEAD
          git config user.name 'Qwen validation'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          node --version
          npm --version
          free -m
      - name: Full repository preflight
        run: |
          set -euo pipefail
          npm run preflight 2>&1 | tee "$RUNNER_TEMP/qwen-12151-preflight.log"
      - name: Build the actual CLI bundle
        run: |
          set -euo pipefail
          npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen-12151-bundle.log"
      - name: Real CLI sparse-glob E2E without retries
        env:
          QWEN_SANDBOX: 'false'
          QWEN_DEBUG_LOG_FILE: '0'
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run --root ./integration-tests glob-ignore-cache.test.ts --retry=0 2>&1 | tee "$RUNNER_TEMP/qwen-12151-cli-e2e.log"
      - name: Verify unchanged tested head and clean worktree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'Exact contribution tested: %s\nBase: %s\nFull preflight and real CLI E2E passed.\n' "$CANDIDATE_SHA" "$BASE_SHA" | tee "$RUNNER_TEMP/qwen-12151-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-12151-linux-validation
          path: |
            ${{ runner.temp }}/qwen-12151-*.log
            ${{ runner.temp }}/qwen-12151-summary.txt
          retention-days: 14
          if-no-files-found: warn
  cross-platform-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 2d1b9b2509666a0b9ed6b8c005238b6f40391447
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and build core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace packages/core
      - name: Existing and new parser regressions
        working-directory: packages/core
        run: |
          set -euo pipefail
          node ../../node_modules/vitest/vitest.mjs run src/utils/gitIgnoreParser.test.ts src/utils/git-ignore-parser-cache.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/qwen-12151-parser.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-12151-parser-${{ matrix.os }}
          path: ${{ runner.temp }}/qwen-12151-parser.log
          retention-days: 14
          if-no-files-found: warn
