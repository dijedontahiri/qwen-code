name: Diagnose issue 12277 preflight stage

on:
  push:
    branches:
      - validation/12277-current-r6
    paths:
      - .github/workflows/validate-12277-current-r5.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PRODUCT_SHA: 65a4fddbbe118660267c4ba813ee029158784178
      BASE_SHA: be9ed41afd2f59492cd372fbe1d52b653e42f3b8
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 65a4fddbbe118660267c4ba813ee029158784178
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify exact source and issue scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$PRODUCT_SHA"
          actual=$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" | sort)
          expected=$(printf '%s\n' \
            packages/cli/src/serve/local-control/service.test.ts \
            packages/cli/src/serve/local-control/service.ts | sort)
          test "$actual" = "$expected"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          node --version
          corepack --version
          df -h .

      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace prerequisites
        run: npm run build

      - name: Prove baseline rejects the busy preferred LAN port
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$BASE_SHA" -- packages/cli/src/serve/local-control/service.ts
          set +e
          npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts \
            -t 'falls back to a free LAN port when the preferred port is in use' \
            2>&1 | tee "$RUNNER_TEMP/12277-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          git checkout "$PRODUCT_SHA" -- packages/cli/src/serve/local-control/service.ts
          test "$status" -ne 0
          grep -F 'falls back to a free LAN port when the preferred port is in use' "$RUNNER_TEMP/12277-baseline.log"
          grep -F 'EADDRINUSE' "$RUNNER_TEMP/12277-baseline.log"
          test -z "$(git diff --name-only "$PRODUCT_SHA" -- packages/cli/src/serve/local-control/service.ts)"

      - name: Run focused Local Control regression
        run: npm test --workspace=packages/cli -- src/serve/local-control/service.test.ts

      - name: Check changed-file formatting
        run: |
          node_modules/.bin/prettier --experimental-cli --check \
            packages/cli/src/serve/local-control/service.ts \
            packages/cli/src/serve/local-control/service.test.ts

      - name: Preflight clean
        run: npm run clean

      - name: Preflight locked install
        run: corepack pnpm install --frozen-lockfile

      - name: Preflight format
        run: npm run format

      - name: Assert formatter did not change source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Preflight lint
        run: npm run lint:ci

      - name: Preflight build
        run: npm run build

      - name: Preflight typecheck
        run: npm run typecheck

      - name: Preflight tests
        run: npm run test:ci

      - name: Preflight serve fast-path check
        run: npm run check:serve-fast-path-bundle

      - name: Final immutable-source audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$BASE_SHA" "$PRODUCT_SHA"
