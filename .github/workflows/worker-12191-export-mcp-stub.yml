name: Complete pinned package diagnostics for issue 12185

on:
  push:
    branches:
      - worker/12191-export-mcp-stub-20260918

permissions:
  contents: read

concurrency:
  group: qwen-maintenance-12191
  cancel-in-progress: false

env:
  SOURCE_SHA: f17370c06965f27d6b82ec14fbae855293f83f93
  PARENT_SHA: eb48b52da82a60341fd4a3b42a2d7410aa734ad7
  SOURCE_TREE: b0ef17e3e0163dab6f8fa77c2975e9dd9c1a5471
  PREFIX_RUN: '35386880791'

jobs:
  diagnose:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.2
          cache: npm
      - name: Record exact source and unchanged SDK inputs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qwen-12191-completion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$PARENT_SHA" "$SOURCE_SHA"
          git diff --exit-code "$PARENT_SHA" "$SOURCE_SHA" -- packages/sdk-typescript packages/acp-bridge package.json package-lock.json
          git diff --check "$PARENT_SHA" "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          {
            date -u +%FT%TZ
            printf 'source=%s\ntree=%s\nparent=%s\nworkflow=%s\nrun=%s\nattempt=%s\nprefix_evidence_run=%s\n' "$SOURCE_SHA" "$SOURCE_TREE" "$PARENT_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PREFIX_RUN"
            echo 'Purpose: isolate a known packed-SDK type failure and execute previously skipped independent checks. Not a transient retry or acceptance bypass.'
            echo 'Previous exact-source run passed workspace build, 22 focused tests, 9 export guards, effective declaration/export/document negative controls, formatting and affected types/lint.'
            echo 'SDK and ACP source trees, root manifest and npm lockfile are unchanged from the inspected PR parent. This is not a full baseline preflight comparison.'
            node --version
            npm --version
            df -h .
            free -m
          } | tee "$OUT/provenance.txt"
      - name: Locked dependency bootstrap
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          npm ci --no-audit --progress=false > "$OUT/npm-ci.log" 2>&1
      - name: Build source prerequisites and actual export renderer
        id: build
        run: |
          set +e
          npm run build > "$OUT/build.log" 2>&1
          code=$?
          set -e
          tail -n 50 "$OUT/build.log"
          echo "$code" > "$OUT/build.exit"
          exit "$code"
      - name: Pack real SDK and Web Shell and install isolated consumer
        id: install
        run: |
          npm pack --workspace=packages/sdk-typescript --pack-destination "$OUT" --json > "$OUT/sdk-pack.log" 2>&1
          npm pack --workspace=packages/web-shell --pack-destination "$OUT" --json > "$OUT/web-shell-pack.log" 2>&1
          python3 - <<'PY'
          import json,os,pathlib,subprocess,tarfile
          out=pathlib.Path(os.environ['OUT']); consumer=out/'consumer'; consumer.mkdir()
          shells=list(out.glob('qwen-code-web-shell-*.tgz')); sdks=list(out.glob('qwen-code-sdk-*.tgz'))
          assert len(shells)==1 and len(sdks)==1
          with tarfile.open(shells[0]) as archive:
            pkg=json.load(archive.extractfile('package/package.json')); names=set(archive.getnames())
            targets=[v for export in pkg['exports'].values() for v in export.values()]
            assert len(targets)==6
            for target in targets: assert 'package/'+target.removeprefix('./') in names, target
            assert not any('document-mcp-app-bridge-stub' in n for n in names)
          def installed(name):
            return subprocess.check_output(['node','-p',f"require({json.dumps(name+'/package.json')}).version"],text=True).strip()
          deps={name:installed(name) for name in ['react','react-dom','@types/react','@types/react-dom','typescript']}
          deps.update({'@qwen-code/web-shell':'file:'+str(shells[0]),'@qwen-code/sdk':'file:'+str(sdks[0])})
          (consumer/'package.json').write_text(json.dumps({'name':'isolated-package-boundary-consumer','private':True,'type':'module','dependencies':deps}))
          (consumer/'consumer.ts').write_text("import * as root from '@qwen-code/web-shell';\nimport * as transcript from '@qwen-code/web-shell/transcript';\nimport * as daemon from '@qwen-code/web-shell/daemon-react-sdk';\nconsole.log(root,transcript,daemon);\n")
          (consumer/'sdk-only.ts').write_text("import * as daemon from '@qwen-code/sdk/daemon';\nconsole.log(daemon);\n")
          options={'target':'ES2022','module':'ESNext','moduleResolution':'Bundler','lib':['ES2022','DOM','DOM.Iterable'],'strict':True,'skipLibCheck':False,'noEmit':True}
          for name in ['consumer','sdk-only']:
            (consumer/(name+'.json')).write_text(json.dumps({'compilerOptions':options,'include':[name+'.ts']}))
          (consumer/'resolve.mjs').write_text("import {existsSync} from 'node:fs'; import {fileURLToPath} from 'node:url'; for (const name of ['@qwen-code/web-shell','@qwen-code/web-shell/transcript','@qwen-code/web-shell/daemon-react-sdk']) { const url=import.meta.resolve(name); if (!existsSync(fileURLToPath(url))) throw new Error(name); console.log(name,url); }\n")
          (out/'consumer-manifest.json').write_text((consumer/'package.json').read_text())
          PY
          (cd "$OUT/consumer" && npm install --no-audit --progress=false) > "$OUT/consumer-install.log" 2>&1
      - name: Isolate SDK-only declaration failure without importing Web Shell
        id: sdk_diagnosis
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT']); consumer=out/'consumer'
          args=['node',str(consumer/'node_modules/typescript/bin/tsc'),'-p',str(consumer/'sdk-only.json')]
          p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          (out/'sdk-only-types.log').write_text(p.stdout); print(p.stdout)
          expected=["Cannot find module '@qwen-code/acp-bridge/daemonEventTypes'", "Cannot find module '../types/permission-mode.js'"]
          assert p.returncode!=0 and all(x in p.stdout for x in expected), 'Expected SDK-only baseline signature was not established'
          errors=[line for line in p.stdout.splitlines() if 'error TS' in line]
          assert len(errors)==2 and all('error TS2307:' in line for line in errors), errors
          assert all('@qwen-code/sdk/dist/daemon/' in line for line in errors), errors
          result={'source':os.environ['SOURCE_SHA'],'sdkInputsUnchangedFrom':os.environ['PARENT_SHA'],'sdkOnlyExit':p.returncode,'errors':errors,'meaning':'Confirmed packaging blocker, NOT a positive consumer pass'}
          (out/'sdk-baseline-diagnosis.json').write_text(json.dumps(result,indent=2))
          print('SDK-only import reproduces both missing declarations without any Web Shell import. Positive package acceptance remains blocked.')
          PY
      - name: Strict packed Web Shell consumer type check
        id: consumer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          node "$OUT/consumer/node_modules/typescript/bin/tsc" -p "$OUT/consumer/consumer.json" > "$OUT/consumer-types.log" 2>&1
          code=$?
          set -e
          cat "$OUT/consumer-types.log"
          echo "$code" > "$OUT/consumer-types.exit"
          exit "$code"
      - name: Independently verify packed runtime exports and symlink consumers
        id: runtime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node "$OUT/consumer/resolve.mjs" | tee "$OUT/consumer-resolution.log"
          ln -s "$OUT/consumer" "$OUT/consumer-link"
          node --preserve-symlinks --preserve-symlinks-main "$OUT/consumer-link/resolve.mjs" | tee "$OUT/consumer-symlink-resolution.log"
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          import {writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          for (const link of [false,true]) {
            const result=await build({absWorkingDir:join(process.env.OUT,link?'consumer-link':'consumer'),entryPoints:['consumer.ts'],bundle:true,write:false,platform:'browser',format:'esm',preserveSymlinks:link,metafile:true,define:{'process.env.NODE_ENV':'"production"'}});
            await writeFile(join(process.env.OUT,link?'consumer-symlink.metafile.json':'consumer.metafile.json'),JSON.stringify(result.metafile));
            console.log('Real packed consumer browser bundle:',link?'symlink':'normal',Object.keys(result.metafile.inputs).length,'inputs');
          }
          JS
      - name: Render actual exported MCP fallback in Chromium
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright install chromium > "$OUT/chromium-install.log" 2>&1
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createServer} from 'node:http';
          import {join} from 'node:path';
          import assert from 'node:assert/strict';
          const dir='packages/web-templates/src/export-html/dist';
          let html=await readFile(join(dir,'document.html'),'utf8');
          const js=await readFile(join(dir,'export-transcript-document.js'));
          const css=await readFile(join(dir,'export-transcript-document.css'));
          const generated=await readFile('packages/web-templates/src/generated/exportTranscriptDocumentTemplate.ts','utf8');
          const version=JSON.parse(generated.match(/export const EXPORT_TRANSCRIPT_RENDERER_VERSION = ("[^"]+")/)[1]);
          const common={createdAt:1,clientReceivedAt:1,updatedAt:1,promptId:'fixture-prompt'};
          const display={type:'mcp_app',serverName:'fixture',resourceUri:'ui://fixture/app',html:'<main>Interactive app</main>',toolResult:{content:[]},toolArguments:{},fallbackText:'Recorded MCP fixture result'};
          const blocks=[{...common,id:'question',kind:'user',text:'Show the recorded MCP result.'},{...common,id:'tool',kind:'tool',toolCallId:'fixture-call',toolName:'mcp__fixture__demo',title:'MCP fixture',status:'completed',preview:{kind:'mcp_invocation',serverId:'fixture',toolName:'demo'},rawOutput:display},{...common,id:'answer',kind:'assistant',text:'The recorded result is shown above.'}];
          const envelope={schemaVersion:1,rendererVersion:version,blocks,metadata:{title:'MCP export boundary verification',exportedAt:new Date().toISOString(),complete:true,truncated:false}};
          html=html.replaceAll('__EXPORT_NONCE__','qwen-validation-12191');
          const pattern=/(<script\b[^>]*\bid="transcript-document"[^>]*>)[\s\S]*?(<\/script>)/;
          assert(pattern.test(html),'Missing document envelope element');
          html=html.replace(pattern,(_,a,b)=>a+JSON.stringify(envelope).replaceAll('<','\\u003c')+b);
          await writeFile(join(process.env.OUT,'document-fixture.html'),html);
          const server=createServer((req,res)=>{if(req.url==='/'){res.setHeader('Content-Type','text/html');res.end(html);}else{res.writeHead(404);res.end();}});
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const browser=await chromium.launch();
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[],unexpected=[];
          try {
            page.on('pageerror',error=>errors.push(error.message));
            const origin='http://127.0.0.1:'+server.address().port;
            await page.route('**/*',async route=>{
              const url=new URL(route.request().url());
              if(url.origin===origin){await route.continue();return;}
              if(url.hostname==='unpkg.com' && url.pathname.endsWith('/export-transcript-document.js')){await route.fulfill({status:200,contentType:'text/javascript',headers:{'access-control-allow-origin':'*'},body:js});return;}
              if(url.hostname==='unpkg.com' && url.pathname.endsWith('/export-transcript-document.css')){await route.fulfill({status:200,contentType:'text/css',headers:{'access-control-allow-origin':'*'},body:css});return;}
              unexpected.push(url.origin+url.pathname); await route.abort();
            });
            await page.goto(origin,{waitUntil:'networkidle'});
            await page.getByText('Recorded MCP fixture result',{exact:true}).waitFor({state:'visible',timeout:15000});
            assert.equal(await page.locator('iframe').count(),0);
            assert.deepEqual(errors,[]); assert.deepEqual(unexpected,[]);
            await writeFile(join(process.env.OUT,'browser-result.json'),JSON.stringify({source:process.env.SOURCE_SHA,errors,unexpected,iframeCount:0,recordedFallbackVisible:true}));
            console.log('Real document rendered recorded MCP fallback with zero iframes, daemon requests, and page errors.');
          } finally {
            await page.screenshot({path:join(process.env.OUT,'document-mcp-fallback.png'),fullPage:true});
            await writeFile(join(process.env.OUT,'browser-diagnostics.json'),JSON.stringify({errors,unexpected,body:await page.locator('body').innerText()}));
            await browser.close();await new Promise(resolve=>server.close(resolve));
          }
          JS
      - name: Full repository preflight (independent, failures remain failures)
        id: preflight
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          npm run preflight > "$OUT/preflight.log" 2>&1
          code=$?
          set -e
          tail -n 100 "$OUT/preflight.log"
          echo "$code" > "$OUT/preflight.exit"
          exit "$code"
      - name: Exact source and clean worktree audit
        id: audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff --exit-code "$SOURCE_SHA"
          git diff --cached --exit-code "$SOURCE_SHA"
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Save true outcomes and handover
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          printf '%s\n' "$STEP_OUTCOMES" > "$OUT/step-outcomes.json"
          git status --porcelain=v1 --untracked-files=all > "$OUT/final-status.txt"
          {
            echo '## Issue 12185 verification completion'
            echo "Immutable product source: $SOURCE_SHA"
            echo "Tree: $SOURCE_TREE"
            echo "Previous same-source prefix evidence: run $PREFIX_RUN"
            echo "This run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT; workflow $GITHUB_SHA"
            echo 'The strict consumer step is not suppressed. Independent browser/runtime/preflight steps run after a consumer failure, but that failure keeps the job red.'
            echo 'No auto-publication. Product branch remains unchanged. SDK-only diagnostic reproduction is not product acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs and genuine screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen-12191-completion-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.exit
            ${{ env.OUT }}/*.txt
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.png
            ${{ env.OUT }}/document-fixture.html
          retention-days: 14
          if-no-files-found: warn
