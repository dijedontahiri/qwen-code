name: Validate issue 12290 current-main MCP resource sniffing

on:
  push:
    branches: [validation/12290-untyped-resource-image]
    paths: [.github/workflows/maintenance-12290-untyped-resource-image.yml]

permissions:
  contents: write

jobs:
  validate-and-publish-candidate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_SHA: 9f3acdb37def3048e1510ce79e4df6cc203d09ab
      PRODUCT_BRANCH: fix/12290-untyped-resource-image
      TARGET_TEST: sniffs an untyped embedded PNG ResourceBlock
      TEST_B64: 
      PROD_B64: 
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QwenLM/qwen-code
          ref: 9f3acdb37def3048e1510ce79e4df6cc203d09ab
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0

      - name: Verify immutable baseline and environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          node --version
          test "$(corepack pnpm --version)" = '11.24.0'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install locked dependencies and build workspace dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only | tee "$RUNNER_TEMP/install.log"
          npm run build | tee "$RUNNER_TEMP/build.log"
          git restore --source=HEAD --staged --worktree .
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Prove intended current-main baseline assertion fails
        run: |
          set -euo pipefail
          cp packages/core/src/tools/mcp-tool.test.ts "$RUNNER_TEMP/mcp-tool.test.ts"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('packages/core/src/tools/mcp-tool.test.ts')
          s = p.read_text()
          anchor = "    it('should handle a mix of content block types', async () => {\n"
          test = base64.b64decode(os.environ['TEST_B64']).decode()
          assert s.count(anchor) == 1, s.count(anchor)
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
          set +e
          (cd packages/core && NO_COLOR=1 npm run test:ci -- --retry=0 src/tools/mcp-tool.test.ts -t "$TARGET_TEST") > "$RUNNER_TEMP/baseline.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$rc" -ne 0
          grep -F "$TARGET_TEST" "$RUNNER_TEMP/baseline.log"
          grep -F '"mimeType": "application/octet-stream"' "$RUNNER_TEMP/baseline.log"
          cp "$RUNNER_TEMP/mcp-tool.test.ts" packages/core/src/tools/mcp-tool.test.ts
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Apply minimal issue 12290 candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('packages/core/src/tools/mcp-tool.ts')
          s = p.read_text()
          anchor = "import { safeJsonStringify } from '../utils/safeJsonStringify.js';\n"
          addition = "import { sniffFileKind } from '../utils/binary-content.js';\n"
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, anchor + addition, 1)
          old = "  if (resource?.blob) {\n    const mimeType = resource.mimeType || 'application/octet-stream';\n    return [\n"
          new = base64.b64decode(os.environ['PROD_B64']).decode()
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('packages/core/src/tools/mcp-tool.test.ts')
          s = p.read_text()
          anchor = "    it('should handle a mix of content block types', async () => {\n"
          test = base64.b64decode(os.environ['TEST_B64']).decode()
          assert s.count(anchor) == 1, s.count(anchor)
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
          git diff --check
          git diff -- packages/core/src/tools/mcp-tool.ts packages/core/src/tools/mcp-tool.test.ts

      - name: Run candidate focused and file regressions
        run: |
          set -euo pipefail
          (cd packages/core && NO_COLOR=1 npm run test:ci -- --retry=0 src/tools/mcp-tool.test.ts -t "$TARGET_TEST") | tee "$RUNNER_TEMP/candidate-focused.log"
          grep -F "$TARGET_TEST" "$RUNNER_TEMP/candidate-focused.log"
          grep -E 'Tests +1 passed' "$RUNNER_TEMP/candidate-focused.log"
          (cd packages/core && NO_COLOR=1 npm run test:ci -- --retry=0 src/tools/mcp-tool.test.ts) | tee "$RUNNER_TEMP/candidate-file.log"
          grep -E 'Test Files +1 passed' "$RUNNER_TEMP/candidate-file.log"
          grep -E 'Tests +[0-9]+ passed' "$RUNNER_TEMP/candidate-file.log"

      - name: Run candidate Core quality gates
        run: |
          set -euo pipefail
          (cd packages/core && npm run typecheck)
          (cd packages/core && npm run lint) | tee "$RUNNER_TEMP/core-lint.log"
          printf '%s\0' packages/core/src/tools/mcp-tool.ts packages/core/src/tools/mcp-tool.test.ts | xargs -0 node_modules/.bin/prettier --check
          git diff --check
          git diff --name-only "$BASE_SHA" -- | sort | tee "$RUNNER_TEMP/changed.txt"
          test "$(wc -l < "$RUNNER_TEMP/changed.txt")" -eq 2
          grep -Fx 'packages/core/src/tools/mcp-tool.test.ts' "$RUNNER_TEMP/changed.txt"
          grep -Fx 'packages/core/src/tools/mcp-tool.ts' "$RUNNER_TEMP/changed.txt"

      - name: Run literal repository preflight
        run: |
          set -euo pipefail
          npm run preflight | tee "$RUNNER_TEMP/preflight.log"

      - name: Final diff and source audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --check
          git diff --name-only "$BASE_SHA" -- | sort | tee "$RUNNER_TEMP/final-changed.txt"
          test "$(wc -l < "$RUNNER_TEMP/final-changed.txt")" -eq 2
          grep -Fx 'packages/core/src/tools/mcp-tool.test.ts' "$RUNNER_TEMP/final-changed.txt"
          grep -Fx 'packages/core/src/tools/mcp-tool.ts' "$RUNNER_TEMP/final-changed.txt"
          git diff -- packages/core/src/tools/mcp-tool.ts packages/core/src/tools/mcp-tool.test.ts
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit and push the exact verified product tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code "https://github.com/dijedontahiri/qwen-code.git" "refs/heads/$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "Product branch already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'Dijedon'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          git add packages/core/src/tools/mcp-tool.ts packages/core/src/tools/mcp-tool.test.ts
          git diff --cached --check
          git commit -m 'fix(core): sniff untyped MCP resource images'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/dijedontahiri/qwen-code.git"
          git push fork "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
