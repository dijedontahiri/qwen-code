name: Issue 12151 CI wiring validation
on:
  push:
    branches: [validation/12151-ci-wiring-20260918]
permissions:
  contents: read
env:
  CI: 'true'
  CANDIDATE_SHA: b7b2a576c3230ea21d20ce27c9152dd549f7a899
  BASE_SHA: ab47e38197fca54a8aa1969862cce9c0049666d5
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: b7b2a576c3230ea21d20ce27c9152dd549f7a899
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Verify exact contribution and five-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf '%s\n' \
            docs/developers/development/_meta.ts \
            docs/developers/development/gitignore-cache.md \
            integration-tests/cli/glob-ignore-cache.test.ts \
            packages/core/src/utils/git-ignore-parser-cache.test.ts \
            packages/core/src/utils/gitIgnoreParser.ts \
            | sort > "$RUNNER_TEMP/expected-files.txt"
          git diff --name-only "$BASE_SHA" HEAD | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git diff --check "$BASE_SHA" HEAD
      - name: Install and build for focused checks
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
      - name: Contract test for no-key allowlist
        run: |
          set -euo pipefail
          npm run test:scripts -- scripts/tests/no-ak-integration-ci.test.js 2>&1 | tee "$RUNNER_TEMP/qwen-12151-contract.log"
      - name: Focused parser regressions
        run: |
          set -euo pipefail
          cd packages/core
          npx vitest run src/utils/gitIgnoreParser.test.ts src/utils/git-ignore-parser-cache.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/qwen-12151-parser.log"
      - name: Bundle and real CLI regression
        env:
          QWEN_SANDBOX: 'false'
          QWEN_DEBUG_LOG_FILE: '0'
        run: |
          set -euo pipefail
          npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen-12151-bundle.log"
          node node_modules/vitest/vitest.mjs run --root ./integration-tests cli/glob-ignore-cache.test.ts --retry=0 2>&1 | tee "$RUNNER_TEMP/qwen-12151-cli-e2e.log"
      - name: Full repository preflight
        run: |
          set -euo pipefail
          npm run preflight 2>&1 | tee "$RUNNER_TEMP/qwen-12151-preflight.log"
      - name: Verify unchanged tested head and clean worktree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'Exact contribution tested: %s\nBase: %s\nFocused contract/parser/CLI tests and full preflight passed.\n' "$CANDIDATE_SHA" "$BASE_SHA" | tee "$RUNNER_TEMP/qwen-12151-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-12151-ci-wiring-validation
          path: |
            ${{ runner.temp }}/qwen-12151-*.log
            ${{ runner.temp }}/qwen-12151-summary.txt
          retention-days: 14
          if-no-files-found: warn
