name: Validate issue 12151 current head

on:
  push:
    branches:
      - validation/12156-02c2466

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Verify exact contribution parent
        run: |
          test "$(git rev-parse HEAD^)" = "02c246659a69297fca66b64efd06117ce9168129"
          git show --stat --oneline HEAD^
      - name: Install dependencies without duplicate prepare build
        env:
          QWEN_SKIP_PREPARE: '1'
        run: npm ci
      - name: Full repository preflight
        run: npm run preflight
      - name: Focused GitIgnoreParser regressions
        run: |
          cd packages/core
          npx vitest run src/utils/gitIgnoreParser.test.ts src/utils/git-ignore-parser-cache.test.ts
      - name: Bundle
        run: npm run bundle
      - name: Real bundled CLI sparse-glob regression
        env:
          CI: 'true'
          QWEN_SANDBOX: 'false'
          QWEN_DEBUG_LOG_FILE: '0'
        run: node node_modules/vitest/vitest.mjs run --root ./integration-tests cli/glob-ignore-cache.test.ts --retry=0
      - name: Final source audit
        run: |
          test "$(git rev-parse HEAD^)" = "02c246659a69297fca66b64efd06117ce9168129"
          git diff --check HEAD^
          git diff --exit-code HEAD^
          test -z "$(git status --porcelain)"
