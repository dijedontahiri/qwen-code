name: Isolate PR 12191 validation failure

on:
  push:
    branches: [validation/12191-failure-isolation-20260920]
    paths: [.github/workflows/validate-12191-failure-isolation.yml]

permissions:
  contents: read
  actions: read

jobs:
  failure-evidence:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract failed preflight evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/dijedontahiri/qwen-code/actions/jobs/105995319806/logs > "$RUNNER_TEMP/preflight.log"
          python3 - "$RUNNER_TEMP/preflight.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          lines = re.sub(r'\x1b\[[0-9;]*m', '', text).splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r'FAIL |AssertionError|Expected:|Received:|Test Files|Tests\s+\d+ failed|Error:', line)]
          selected = set()
          for i in matches[-20:]:
              selected.update(range(max(0, i - 3), min(len(lines), i + 14)))
          for i in sorted(selected):
              print(f'{i + 1}: {lines[i]}')
          if not matches:
              print('\n'.join(lines[-100:]))
          PY
  focused-comparison:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline
            sha: e45362e2c2af9cc765a43c02815c813e9551f53a
          - source: product
            sha: 3ec369460d5e667289e297961457dd259dba42a7
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Verify source and install locked historical dependencies
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --version
          npm --version
          if node -e 'process.exit(require("./package.json").packageManager?.startsWith("pnpm@") ? 0 : 1)'; then
            corepack pnpm install --frozen-lockfile
          else
            npm ci --no-audit --no-fund
          fi
      - name: Focused WebFetch tests on unchanged source
        working-directory: packages/core
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run src/tools/web-fetch.test.ts --reporter=verbose
      - name: Audit unchanged product source
        if: always()
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
