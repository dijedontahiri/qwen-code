name: Validate private document export
on:
  push:
    branches: [validation/web-shell-transcript-boundary-20260918]
    paths: [.github/workflows/validate-private-document-export.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 095b5d781d973c06b4c0c72cb984a463a6c68253
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Prepare the focused private-export candidate
        run: |
          mkdir -p /tmp/evidence
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def replace(path, old, new):
              path = Path(path)
              source = path.read_text()
              assert source.count(old) == 1, (str(path), old, source.count(old))
              path.write_text(source.replace(old, new))
          helper = subprocess.check_output(['git', 'show', '84348e46dd38611c20200639175a8b9cb530b22c:packages/web-shell/build-boundary.ts'], text=True)
          helper = helper.replace('isTranscriptBuild', 'isDocumentExport')
          helper = helper.replace("// Preserve Rollup's MCP App tree shaking before the standalone HTML export\n  // bundles the transcript.", "// Only the private document build bundles MCP Apps. Public library entries\n  // keep one shared dependency instance. Preserve Rollup's tree shaking here.")
          Path('packages/web-shell/build-boundary.ts').write_text(helper)
          tests = subprocess.check_output(['git', 'show', '84348e46dd38611c20200639175a8b9cb530b22c:packages/web-shell/client/build-boundary.test.ts'], text=True)
          tests = tests.replace('isTranscriptBuild', 'isDocumentExport').replace('in the transcript build only', 'in the private document build only').replace('in the transcript build', 'in the private document build')
          tests = tests.replace("import { shouldExternalizeWebShellDependency } from '../build-boundary';", "import { shouldExternalizeWebShellDependency } from '../build-boundary';\nimport libraryConfig from '../vite.lib.config';")
          tests += """
          describe('public and private Web Shell library modes', () => {
            it.each(['production', 'transcript'])('keeps MCP Apps external in public %s output', async (mode) => {
              if (typeof libraryConfig !== 'function') throw new Error('Expected a mode-aware library configuration');
              const config = await libraryConfig({ command: 'build', mode });
              const external = config.build?.rollupOptions?.external;
              if (typeof external !== 'function') throw new Error('Expected an external dependency matcher');
              expect(external('@modelcontextprotocol/ext-apps/app-bridge', undefined, false)).toBe(true);
              expect(config.build?.outDir).toBe('dist');
            });
            it('isolates tree-shaken document output from published entrypoints', async () => {
              if (typeof libraryConfig !== 'function') throw new Error('Expected a mode-aware library configuration');
              const config = await libraryConfig({ command: 'build', mode: 'document-export' });
              const external = config.build?.rollupOptions?.external;
              if (typeof external !== 'function') throw new Error('Expected an external dependency matcher');
              expect(external('@modelcontextprotocol/ext-apps/app-bridge', undefined, false)).toBe(false);
              expect(external('react', undefined, false)).toBe(true);
              expect(config.build?.outDir).toBe('dist/document-export');
              expect(config.build?.lib).toMatchObject({ entry: { transcript: 'client/transcript.ts' } });
            });
          });
          """
          Path('packages/web-shell/client/build-boundary.test.ts').write_text(tests)
          replace('packages/web-shell/vite.lib.config.ts', '    emptyOutDir: false,', "    emptyOutDir: false,\n    // Document-only dependency bundling must never enter the published entries.\n    outDir: mode === 'document-export' ? 'dist/document-export' : 'dist',")
          replace('packages/web-shell/vite.lib.config.ts', "mode === 'transcript'\n          ?", "mode === 'transcript' || mode === 'document-export'\n          ?")
          replace('packages/web-shell/vite.lib.config.ts', 'external: shouldExternalizeWebShellDependency,', "external: (id) => shouldExternalizeWebShellDependency(id, mode === 'document-export'),")
          replace('packages/web-shell/package.json', 'vite build --config vite.lib.config.ts --mode transcript &&', 'vite build --config vite.lib.config.ts --mode transcript && vite build --config vite.lib.config.ts --mode document-export &&')
          replace('packages/web-templates/src/export-html/build.mjs', "  entryPoints: [join(srcDir, 'document-main.tsx')],", "  entryPoints: [join(srcDir, 'document-main.tsx')],\n  // The public transcript keeps shared dependencies external. Its private\n  // build preserves tree shaking for this standalone renderer without\n  // publishing a duplicate MCP App instance to package consumers.\n  alias: {\n    '@qwen-code/web-shell/transcript': join(assetsDir, '..', '..', '..', 'web-shell', 'dist', 'document-export', 'transcript.js'),\n  },")
          replace('packages/web-templates/src/export-html/transcript-css-entry.mjs', r'/web-shell[\\/]dist[\\/]transcript\.js$/', r'/web-shell[\\/]dist[\\/](?:document-export[\\/])?transcript\.js$/')
          replace('packages/web-templates/src/export-html/import-meta-guard.mjs', r'/web-shell[/\\]dist[/\\]transcript\.js$/', r'/web-shell[/\\]dist[/\\](?:document-export[/\\])?transcript\.js$/')
          replace('scripts/tests/export-html-import-meta-guard.test.js', "  'web-shell',\n  'dist',\n  'transcript.js',", "  'web-shell',\n  'dist',\n  'document-export',\n  'transcript.js',")
          with Path('scripts/tests/export-html-import-meta-guard.test.js').open('a') as file:
              file.write(r'''
          describe('private document transcript import.meta guard', () => {
            const at = (file) => ({ id: 'empty-import-meta', location: { file, line: 1, column: 1 } });
            it.each(['packages/web-shell/dist/document-export/transcript.js', 'C:\\repo\\packages\\web-shell\\dist\\document-export\\transcript.js'])('retains the exact three-read limit for %s', (file) => {
              const warnings = Array.from({ length: TOLERATED_TRANSCRIPT_IMPORT_META_READS }, () => at(file));
              expect(findUnexpectedImportMeta(warnings)).toEqual([]);
              expect(findUnexpectedImportMeta([...warnings, at(file)])).toHaveLength(1);
            });
            it('does not allow other private-output files', () => {
              expect(findUnexpectedImportMeta([at('packages/web-shell/dist/document-export/index.js')])).toHaveLength(1);
            });
            it('does not reset the read limit between public and private entries', () => {
              const warnings = Array.from({ length: TOLERATED_TRANSCRIPT_IMPORT_META_READS }, () => at('packages/web-shell/dist/transcript.js'));
              expect(findUnexpectedImportMeta([...warnings, at('packages/web-shell/dist/document-export/transcript.js')])).toHaveLength(1);
            });
          });
          ''')
          with Path('scripts/tests/transcript-css-entry-filter.test.js').open('a') as file:
              file.write(r'''
          describe('private document transcript CSS entry filter', () => {
            it.each(['/repo/packages/web-shell/dist/document-export/transcript.js', 'C:\\repo\\packages\\web-shell\\dist\\document-export\\transcript.js'])('matches the isolated transcript at %s', (file) => {
              expect(TRANSCRIPT_CSS_ENTRY_FILTER.test(file)).toBe(true);
            });
            it.each(['/repo/packages/web-shell/dist/document-export/index.js', '/repo/packages/web-shell/dist/document-export/nested/transcript.js', '/repo/packages/web-shell/dist/document-export/transcript.js.map'])('still rejects non-entry files at %s', (file) => {
              expect(TRANSCRIPT_CSS_ENTRY_FILTER.test(file)).toBe(false);
            });
          });
          ''')
          Path('.qwen/e2e-tests/2026-09-18-web-shell-package-artifacts.md').write_text('''# Web Shell package artifact verification

          Issue: #12185

          ## Public package correctness

          1. Run `npm ci` and `npm run build --workspace=@qwen-code/web-shell`.
          2. Run `npm run verify:package --workspace=@qwen-code/web-shell`. Every declared export target must exist and emitted declaration module specifiers must not contain repository-only `@/` aliases.
          3. Run the complete Web Shell tests. Both public library modes must externalize every declared dependency and peer dependency, including MCP Apps. Only the existing KaTeX and xterm CSS entrypoints stay bundleable.
          4. Run `npm run prepublishOnly --workspace=@qwen-code/web-shell`, then `npm pack --workspace=@qwen-code/web-shell --dry-run --json`. Confirm no `dist/document-export/` files are included. These commands do not publish anything.

          ## Standalone document output

          The additional `document-export` mode builds a private transcript under `dist/document-export/transcript.js`. Only this non-published build bundles MCP Apps before the standalone renderer's esbuild pass. The normal and public transcript entries keep the dependency external, avoiding duplicate singleton state for package consumers.

          1. Run `node packages/web-templates/src/export-html/build.mjs`. The unchanged 1,930,000-byte renderer budget and structural dependency guards must pass.
          2. Run `npm run test:scripts -- scripts/tests/transcript-css-entry-filter.test.js scripts/tests/export-html-import-meta-guard.test.js`. Private transcript paths must work with POSIX and Windows separators. Other files, nested paths, and a fourth import.meta read must still be rejected. The end-to-end probe must mutate the actual private input consumed by the document build.
          3. For the before/after proof, keep the built public transcript but temporarily remove only the document alias from the export build: it must reproduce the oversized renderer. Restore the alias and confirm the budget passes. Never increase or disable the budget for this comparison.
          4. Run `npm run preflight` from the root. Record any unrelated failures separately instead of representing a focused package validation as full preflight success.

          ## Declaration guard regression

          Re-emit declarations with `tsc -p tsconfig.lib.json` without alias rewriting. Confirm the package verifier rejects the unresolved `@/` module specifiers. Run the alias rewriter and confirm the verifier passes. Restore any modified build artifacts after negative probes.

          ## Evidence policy

          Record exact source SHAs, real test counts, and the final measured renderer size. Fork validation does not replace upstream CI authorization or maintainer review. Private document artifacts are build intermediates, not package exports or additional published runtime copies.
          ''')
          allowed = ['.qwen/e2e-tests/2026-09-18-web-shell-package-artifacts.md','packages/web-shell/build-boundary.ts','packages/web-shell/client/build-boundary.test.ts','packages/web-shell/package.json','packages/web-shell/scripts/rewrite-declaration-aliases.mjs','packages/web-shell/scripts/verify-package.mjs','packages/web-shell/vite.lib.config.ts','packages/web-templates/src/export-html/build.mjs','packages/web-templates/src/export-html/import-meta-guard.mjs','packages/web-templates/src/export-html/transcript-css-entry.mjs','scripts/tests/export-html-import-meta-guard.test.js','scripts/tests/transcript-css-entry-filter.test.js']
          actual = subprocess.check_output(['git','diff','--name-only','e596a410bbd58313b6db069eed1cbb33bd3dbd8f'],text=True).splitlines()
          assert sorted(actual) == sorted(allowed), actual
          Path('/tmp/evidence/allowed-files.json').write_text(json.dumps(allowed))
          PY
      - name: Install dependencies with normal full workspace preparation
        id: install
        run: |
          npm ci --no-audit --no-fund > /tmp/evidence/install-build.log 2>&1 || { tail -n 160 /tmp/evidence/install-build.log; exit 1; }
          tail -n 35 /tmp/evidence/install-build.log
      - name: Format the scoped candidate and record its commit
        id: candidate
        run: |
          node -e "const {execFileSync}=require('node:child_process'); const files=require('/tmp/evidence/allowed-files.json'); execFileSync('npm',['exec','--','prettier','--write',...files],{stdio:'inherit'}); execFileSync('git',['add','--',...files]);"
          git -c user.name=Dijedon -c user.email=99071957+dijedontahiri@users.noreply.github.com commit -m 'fix(web-shell): isolate document-only dependency bundling'
          git rev-parse HEAD | tee /tmp/evidence/candidate-sha.txt
          git diff --stat 095b5d781d973c06b4c0c72cb984a463a6c68253 HEAD
          git diff --check
          git diff --exit-code
      - name: Prove public dependency boundaries and declaration guards
        run: |
          npm exec --workspace=@qwen-code/web-shell -- vitest run client/build-boundary.test.ts --coverage.enabled=false --retry=0 --reporter=json --outputFile=/tmp/evidence/boundary-tests.json > /tmp/evidence/boundary-tests.log 2>&1 || { cat /tmp/evidence/boundary-tests.log; exit 1; }
          npm exec --workspace=@qwen-code/web-shell -- tsc -p tsconfig.lib.json
          set +e
          node packages/web-shell/scripts/verify-package.mjs > /tmp/evidence/before-alias-rewrite.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F '@/' /tmp/evidence/before-alias-rewrite.log
          node packages/web-shell/scripts/rewrite-declaration-aliases.mjs
          npm run verify:package --workspace=@qwen-code/web-shell
          npm run prepublishOnly --workspace=@qwen-code/web-shell
          npm pack --workspace=@qwen-code/web-shell --dry-run --json > /tmp/evidence/package-contents.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const pack = JSON.parse(fs.readFileSync('/tmp/evidence/package-contents.json','utf8'));
          if (!pack[0]?.files?.length || pack[0].files.some(file => file.path.startsWith('dist/document-export/'))) throw new Error('Private document output must not ship in the package');
          const publicTranscript = fs.readFileSync('packages/web-shell/dist/transcript.js','utf8');
          if (!publicTranscript.includes('@modelcontextprotocol/ext-apps/app-bridge')) throw new Error('Public transcript must preserve the external MCP App dependency');
          if (!fs.existsSync('packages/web-shell/dist/document-export/transcript.js')) throw new Error('Missing private document build');
          console.log('Verified public MCP dependency remains external and private build is not packaged.');
          JS
      - name: Prove the actual document budget fails before and passes after
        run: |
          source=packages/web-templates/src/export-html/build.mjs
          trap 'git restore -- "$source"' EXIT
          git show 095b5d781d973c06b4c0c72cb984a463a6c68253:"$source" > "$source"
          set +e
          node "$source" > /tmp/evidence/before-export.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'expected <= 1930000' /tmp/evidence/before-export.log
          git restore -- "$source"
          EXPORT_HTML_METAFILE=/tmp/evidence/after-export-metafile.json node "$source" > /tmp/evidence/after-export.log 2>&1
          tail -n 25 /tmp/evidence/after-export.log
      - name: Complete Web Shell suite and exact export guard tests
        run: |
          npm run test:ci --workspace=@qwen-code/web-shell > /tmp/evidence/web-shell-tests.log 2>&1 || { tail -n 180 /tmp/evidence/web-shell-tests.log; exit 1; }
          grep -E 'Test Files|Tests |Duration' /tmp/evidence/web-shell-tests.log | tail -n 12
          npm run test:scripts -- scripts/tests/transcript-css-entry-filter.test.js scripts/tests/export-html-import-meta-guard.test.js > /tmp/evidence/export-guards.log 2>&1 || { tail -n 180 /tmp/evidence/export-guards.log; exit 1; }
          tail -n 35 /tmp/evidence/export-guards.log
      - name: TypeScript, lint, and scope audit
        run: |
          npm exec --workspace=@qwen-code/web-shell -- tsc --noEmit > /tmp/evidence/types.log 2>&1 || { cat /tmp/evidence/types.log; exit 1; }
          node -e "const {execFileSync}=require('node:child_process'); const files=require('/tmp/evidence/allowed-files.json'); execFileSync('npm',['exec','--','prettier','--check',...files],{stdio:'inherit'}); execFileSync('npm',['exec','--','eslint',...files.filter(file=>/\.(ts|js|mjs)$/.test(file))],{stdio:'inherit'});"
          git diff --check
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$(cat /tmp/evidence/candidate-sha.txt)"
          git diff --name-only e596a410bbd58313b6db069eed1cbb33bd3dbd8f HEAD > /tmp/evidence/final-files.txt
      - name: Push only the verified candidate to a new fork branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = dijedontahiri/qwen-code
          test "$(git rev-parse HEAD)" = "$(cat /tmp/evidence/candidate-sha.txt)"
          git diff --exit-code
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push https://github.com/dijedontahiri/qwen-code HEAD:refs/heads/candidate/private-document-export-20260918
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: private-document-export-validation
          path: /tmp/evidence
          retention-days: 14
          if-no-files-found: error
