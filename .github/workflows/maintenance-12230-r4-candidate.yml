name: Validate issue 12230 final review candidate

on:
  push:
    branches:
      - validation/12230-review-r7-validator
    paths:
      - .github/workflows/maintenance-12230-r4-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 476f1e9dfa00160c949da7238c284f7b405a8898
      PUBLIC_HEAD_SHA: aec6623e184a3d58502f712c8cc6b9e2af54bb77
      PROD_FILE: packages/web-shell/client/daemon/session/DaemonSessionProvider.tsx
      TEST_FILE: packages/web-shell/client/daemon/session/DaemonSessionProvider.test.tsx
      REARM_TEST: withholds the live settlement while a journal repair targets the same prompt
      FAILURE_TEST: keeps the retained transcript and reports one repair failure
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dijedontahiri/qwen-code
          ref: 476f1e9dfa00160c949da7238c284f7b405a8898
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0

      - name: Verify immutable candidate identity and runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$PUBLIC_HEAD_SHA"
          test -z "$(git status --short)"
          git diff --check "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          node -e "const p=require('./package.json'); if (!p.packageManager.startsWith('pnpm@11.24.0')) throw new Error('unexpected packageManager '+p.packageManager); if (!String(p.engines?.node||'').includes('>=22')) throw new Error('unexpected node engine')"
          node --version
          corepack pnpm --version
          df -h .

      - name: Install locked dependencies and build workspace
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          npm run build
          git restore --source="$CANDIDATE_SHA" --staged --worktree .
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --short)"

      - name: Prove re-arm regression fails without the review fix
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['PROD_FILE'])
          s = p.read_text()
          old = """                  if (existingRepair?.withheldSettlement) {
                    publishPromptSettlement(existingRepair.withheldSettlement);
                  }
          """
          if s.count(old) != 1:
              raise SystemExit(f'expected one re-arm release block, got {s.count(old)}')
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          set +e
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$REARM_TEST") >"$RUNNER_TEMP/rearm-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/rearm-negative.log"
          test "$status" -ne 0
          grep -F '1 failed' "$RUNNER_TEMP/rearm-negative.log"
          grep -F '1 passed' "$RUNNER_TEMP/rearm-negative.log"
          grep -F 'repair re-arms' "$RUNNER_TEMP/rearm-negative.log"
          git restore --source="$CANDIDATE_SHA" -- "$PROD_FILE"
          test -z "$(git status --short)"

      - name: Prove failure path stays fail-closed
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['PROD_FILE'])
          s = p.read_text()
          old = """            recoverable: true,
          });
          liveJournalRepairRef.current = undefined;
        },
      );
          """
          new = """            recoverable: true,
          });
          if (repair.withheldSettlement) {
            publishPromptSettlement(repair.withheldSettlement);
          }
          liveJournalRepairRef.current = undefined;
        },
      );
          """
          if s.count(old) != 1:
              raise SystemExit(f'expected one repair failure catch anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          set +e
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$FAILURE_TEST") >"$RUNNER_TEMP/failure-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/failure-negative.log"
          test "$status" -ne 0
          grep -F '7 failed' "$RUNNER_TEMP/failure-negative.log"
          grep -F 'to deeply equal []' "$RUNNER_TEMP/failure-negative.log"
          grep -F '"promptId": "prompt-live"' "$RUNNER_TEMP/failure-negative.log"
          git restore --source="$CANDIDATE_SHA" -- "$PROD_FILE"
          test -z "$(git status --short)"

      - name: Run focused corrected regressions
        run: |
          set -euo pipefail
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$REARM_TEST") 2>&1 | tee "$RUNNER_TEMP/rearm-positive.log"
          grep -F '2 passed' "$RUNNER_TEMP/rearm-positive.log"
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx -t "$FAILURE_TEST") 2>&1 | tee "$RUNNER_TEMP/failure-positive.log"
          grep -F '7 passed' "$RUNNER_TEMP/failure-positive.log"

      - name: Run complete affected test file
        run: |
          set -euo pipefail
          (cd packages/web-shell && npx vitest run --config vitest.config.ts client/daemon/session/DaemonSessionProvider.test.tsx) 2>&1 | tee "$RUNNER_TEMP/affected-file.log"
          grep -F 'Test Files  1 passed (1)' "$RUNNER_TEMP/affected-file.log"
          grep -F 'Tests  411 passed (411)' "$RUNNER_TEMP/affected-file.log"

      - name: Run Web Shell type lint and format checks
        run: |
          set -euo pipefail
          (cd packages/web-shell && npm run typecheck)
          (cd packages/web-shell && npm run lint)
          (cd packages/web-shell && npm run format:check)

      - name: Verify exact candidate scope before repository preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$PUBLIC_HEAD_SHA"
          test -z "$(git status --short)"
          git diff --check "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"

      - name: Run literal repository preflight
        run: |
          set -euo pipefail
          npm run preflight

      - name: Final immutable source and residue audit
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$PUBLIC_HEAD_SHA"
          git diff --check "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$PUBLIC_HEAD_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$PROD_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          test -z "$(git status --short)"
