name: Prepare PR 12191 document guards

on:
  push:
    branches:
      - validation/12191-document-guards-r14
    paths:
      - .github/workflows/prepare-12191-document-guards-r14.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout validation helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: validator
          persist-credentials: false

      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 9efce16d482095b24d155513c0e6e513a12bfbdb
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Verify immutable source
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9efce16d482095b24d155513c0e6e513a12bfbdb"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install locked dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Apply review repairs in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python validator/.github/validation/prepare-12191-document-guards.py product/packages/web-templates/src/export-html/build.mjs patch
          cd product
          git diff --check -- packages/web-templates/src/export-html/build.mjs
          git diff -- packages/web-templates/src/export-html/build.mjs > ../document-guards.patch
          test -s ../document-guards.patch

      - name: Check formatting
        working-directory: product
        run: npx prettier --experimental-cli --check packages/web-templates/src/export-html/build.mjs

      - name: Build Web Shell
        working-directory: product
        run: npm run build --workspace @qwen-code/web-shell

      - name: Build document renderer with tightened guard
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node packages/web-templates/src/export-html/build.mjs 2>&1 | tee ../document-build.log
          grep -F 'Document export renderer JS is 1806361 bytes' ../document-build.log

      - name: Prove MCP substitution engagement guard catches resolver loss
        shell: bash
        run: |
          set -euo pipefail
          cp product/packages/web-templates/src/export-html/build.mjs build.patched.mjs
          python validator/.github/validation/prepare-12191-document-guards.py product/packages/web-templates/src/export-html/build.mjs remove-resolver
          set +e
          (cd product && node packages/web-templates/src/export-html/build.mjs) > mcp-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'Document export did not use document-mcp-app-bridge-stub.ts' mcp-negative.log
          cp build.patched.mjs product/packages/web-templates/src/export-html/build.mjs
          cmp build.patched.mjs product/packages/web-templates/src/export-html/build.mjs

      - name: Final patched-file checks
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --experimental-cli --check packages/web-templates/src/export-html/build.mjs
          git diff --check -- packages/web-templates/src/export-html/build.mjs
          test "$(git diff --name-only)" = "packages/web-templates/src/export-html/build.mjs"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Gather validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cp product/packages/web-templates/src/export-html/build.mjs prepared/build.mjs
          cp document-guards.patch prepared/document-guards.patch
          cp document-build.log prepared/document-build.log
          cp mcp-negative.log prepared/mcp-negative.log

      - name: Upload exact prepared file and proof logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr12191-document-guards-r14
          path: prepared
          if-no-files-found: error
          retention-days: 1
