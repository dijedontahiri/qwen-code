name: Validate PR 12115 head 0647a394
on:
  push:
    branches: [validation/12115-0647a394-20260918-r9]
    paths: [.github/workflows/validate-12115-0647a394.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      SOURCE_SHA: 0647a394c9a467e6a542a2fc686e2043052456b8
    steps:
      - name: Check out immutable product head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0647a394c9a467e6a542a2fc686e2043052456b8
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify exact source and clean tree
        run: |
          mkdir -p /tmp/evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check HEAD^
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund > /tmp/evidence/npm-ci.log 2>&1 || { tail -n 180 /tmp/evidence/npm-ci.log; exit 1; }
          node --version | tee /tmp/evidence/node-version.txt
          npm --version | tee /tmp/evidence/npm-version.txt
      - name: Mutation proof for base-url warning condition
        run: |
          file=scripts/installation/install-qwen-standalone.sh
          cp "$file" /tmp/evidence/installer-pristine.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/installation/install-qwen-standalone.sh')
          s=p.read_text()
          old='''    if [[ -n "${BASE_URL}" ]]; then\n        log_warning "--base-url mirrors are checked against the official standalone runtime requirement. For a custom runtime, use --archive after verifying compatibility with this host."\n    fi\n'''
          new='''    log_warning "--base-url mirrors are checked against the official standalone runtime requirement. For a custom runtime, use --archive after verifying compatibility with this host."\n'''
          if s.count(old) != 1: raise SystemExit('expected one base-url warning guard')
          p.write_text(s.replace(old,new))
          PY
          set +e
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js > /tmp/evidence/base-url-mutation.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'base-url mirrors are checked' /tmp/evidence/base-url-mutation.log
          git restore -- "$file"
          cmp "$file" /tmp/evidence/installer-pristine.sh
      - name: Mutation proof for distro GLIBC parser arm
        run: |
          file=scripts/installation/install-qwen-standalone.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/installation/install-qwen-standalone.sh')
          s=p.read_text()
          old='/GNU libc|GNU C Library|GLIBC/'
          new='/GNU libc|GNU C Library/'
          if s.count(old) != 1: raise SystemExit('expected one GLIBC parser alternation')
          p.write_text(s.replace(old,new))
          PY
          set +e
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js > /tmp/evidence/glibc-banner-mutation.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'distro-branded glibc banner' /tmp/evidence/glibc-banner-mutation.log
          git restore -- "$file"
          cmp "$file" /tmp/evidence/installer-pristine.sh
      - name: Focused installer suites and shell validation
        run: |
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js scripts/tests/install-script.test.js > /tmp/evidence/installer-tests.log 2>&1 || { tail -n 220 /tmp/evidence/installer-tests.log; exit 1; }
          node scripts/lint.js --shellcheck > /tmp/evidence/shellcheck.log 2>&1 || { cat /tmp/evidence/shellcheck.log; exit 1; }
          npm exec -- prettier --experimental-cli --check scripts/installation/install-qwen-standalone.sh scripts/tests/install-glibc-preflight.test.js scripts/tests/install-script.test.js docs/INSTALLATION_GUIDE.md
      - name: Full repository preflight
        run: |
          npm run preflight > /tmp/evidence/preflight.log 2>&1 || { tail -n 260 /tmp/evidence/preflight.log; exit 1; }
          tail -n 80 /tmp/evidence/preflight.log
      - name: Verify exact final source and clean worktree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-12115-0647a394-evidence
          path: /tmp/evidence
          retention-days: 14
          if-no-files-found: warn
