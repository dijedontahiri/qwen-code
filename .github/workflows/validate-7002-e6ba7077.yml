name: Validate issue 7002 review repair

on:
  push:
    branches:
      - validation/7002-e6ba7077

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: e6ba70778c4d39723317b25ae1095545c2ed98e9
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check HEAD^
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install dependencies
        run: npm ci

      - name: Prove download-status decoupling against previous test harness
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/installation/install-qwen-standalone.sh /tmp/installer.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/installation/install-qwen-standalone.sh')
          text = path.read_text()
          old = '''                    log_warning "Failed to download standalone archive."
                    if [[ "${METHOD}" == "detect" ]]; then
                        return 2
                    fi
                    return 1'''
          new = old.rsplit('return 1', 1)[0] + 'return 3'
          assert old in text, 'standalone download failure block changed'
          path.write_text(text.replace(old, new, 1))
          PY
          grep -A4 -F 'Failed to download standalone archive.' scripts/installation/install-qwen-standalone.sh | grep -F 'return 3'

          git checkout HEAD^ -- scripts/tests/install-glibc-preflight.test.js
          set +e
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js > /tmp/baseline.log 2>&1
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0
          grep -F 'expected 3 to be 1' /tmp/baseline.log

          git checkout HEAD -- scripts/tests/install-glibc-preflight.test.js
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js

          cp /tmp/installer.sh scripts/installation/install-qwen-standalone.sh
          git diff --exit-code

      - name: Run focused installer suites
        run: |
          npm run test:scripts -- scripts/tests/install-glibc-preflight.test.js
          npm run test:scripts -- scripts/tests/install-script.test.js

      - name: Run shell checks
        run: node scripts/lint.js --shellcheck

      - name: Full repository preflight
        run: npm run preflight

      - name: Final exact-source audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
