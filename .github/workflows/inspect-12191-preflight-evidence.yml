name: Inspect blocked contribution evidence

on:
  push:
    branches: [validation/12191-failure-isolation-20260920]
    paths: [.github/workflows/inspect-12191-preflight-evidence.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact Qwen assertion failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/dijedontahiri/qwen-code/actions/jobs/105995319806/logs > "$RUNNER_TEMP/preflight.log"
          python3 - "$RUNNER_TEMP/preflight.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          lines = re.sub(r'\x1b\[[0-9;]*m', '', text).splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r'\bFAIL\s+.*\.test\.|AssertionError: expected|Test Files\s+\d+ failed', line)]
          selected = set()
          for i in matches:
              selected.update(range(max(0, i - 2), min(len(lines), i + 65)))
          for i in sorted(selected)[:250]:
              print(f'{i + 1}: {lines[i]}')
          if not matches:
              raise SystemExit('No structured failure found; evidence extraction incomplete')
          PY
      - name: Extract Strapi browser failure without rerunning upstream jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/strapi/strapi/actions/jobs/105660843251/logs > "$RUNNER_TEMP/strapi.log"
          python3 - "$RUNNER_TEMP/strapi.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          lines = re.sub(r'\x1b\[[0-9;]*m', '', text).splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r'\d+\) \[webkit\]|Error:.*(?:expect|Timeout)|TimeoutError|\b\d+ failed\b|\[error\]', line)]
          selected = set()
          for i in matches[-10:]:
              selected.update(range(max(0, i - 3), min(len(lines), i + 45)))
          for i in sorted(selected)[:250]:
              print(f'{i + 1}: {lines[i]}')
          if not matches:
              print('\n'.join(lines[-80:]))
          PY
