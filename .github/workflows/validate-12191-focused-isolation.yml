name: Validate PR 12191 exact source

on:
  push:
    branches: [validation/12191-4508cb2e-r12]
    paths: [.github/workflows/validate-12191-focused-isolation.yml]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      SOURCE_SHA: 5d004749bef5914c44a265c79f81bd97bd463ba6
    steps:
      - name: Check out immutable product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SDK and Web Shell
        run: |
          npm run build --workspace=@qwen-code/sdk
          npm run build --workspace=@qwen-code/web-shell
          node packages/web-shell/scripts/verify-publish-artifacts.mjs

      - id: externalization
        name: Package externalization artifact regression
        continue-on-error: true
        run: npm exec --workspace=@qwen-code/web-shell -- vitest run --config vitest.config.ts client/package-externalization.artifact.test.ts --coverage.enabled=false --retry=0

      - id: boundary
        name: Build boundary regression
        continue-on-error: true
        run: npm exec --workspace=@qwen-code/web-shell -- vitest run --config vitest.config.ts client/build-boundary.test.ts --coverage.enabled=false --retry=0

      - id: document
        name: MCP document DOM regression
        continue-on-error: true
        run: npm exec --workspace=@qwen-code/web-shell -- vitest run --config vitest.config.ts client/components/messages/McpApp.document.dom.test.tsx --coverage.enabled=false --retry=0

      - id: artifact
        name: Existing build artifact regression
        continue-on-error: true
        run: npm exec --workspace=@qwen-code/web-shell -- vitest run --config vitest.config.ts client/build-artifact.test.ts --coverage.enabled=false --retry=0

      - name: Require every focused regression to pass
        shell: bash
        env:
          EXTERNALIZATION: ${{ steps.externalization.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          DOCUMENT: ${{ steps.document.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          printf 'externalization=%s\nboundary=%s\ndocument=%s\nartifact=%s\n' "$EXTERNALIZATION" "$BOUNDARY" "$DOCUMENT" "$ARTIFACT"
          test "$EXTERNALIZATION" = success
          test "$BOUNDARY" = success
          test "$DOCUMENT" = success
          test "$ARTIFACT" = success

      - id: typecheck
        name: Web Shell typecheck
        continue-on-error: true
        run: npm run typecheck --workspace=@qwen-code/web-shell

      - id: lint
        name: Web Shell lint
        continue-on-error: true
        run: npm run lint --workspace=@qwen-code/web-shell

      - id: format
        name: Web Shell format check
        continue-on-error: true
        run: npm run format:check --workspace=@qwen-code/web-shell

      - name: Require every Web Shell quality check to pass
        shell: bash
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
        run: |
          set -euo pipefail
          printf 'typecheck=%s\nlint=%s\nformat=%s\n' "$TYPECHECK" "$LINT" "$FORMAT"
          test "$TYPECHECK" = success
          test "$LINT" = success
          test "$FORMAT" = success

      - name: Verify document export boundary
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_HTML_METAFILE=/tmp/document-metafile.json node packages/web-templates/src/export-html/build.mjs
          document=packages/web-templates/src/export-html/dist/export-transcript-document.js
          bytes=$(wc -c < "$document")
          echo "document bytes: $bytes"
          test "$bytes" -le 1930000
          if grep -Fq 'node_modules/@modelcontextprotocol/' /tmp/document-metafile.json; then
            echo 'MCP Apps runtime leaked into static document inputs' >&2
            exit 1
          fi

      - name: Pack and verify publication boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/packs /tmp/packed-web /tmp/consumer
          mkdir -p /tmp/packs /tmp/packed-web /tmp/consumer/node_modules/@qwen-code
          npm run prepublishOnly --workspace=@qwen-code/web-shell
          npm pack --workspace=packages/web-shell --pack-destination /tmp/packs >/tmp/web-pack-name.txt
          web_tgz=$(find /tmp/packs -maxdepth 1 -name 'qwen-code-web-shell-*.tgz' -print -quit)
          test -n "$web_tgz"
          tar -xzf "$web_tgz" -C /tmp/packed-web
          for target in dist/index.js dist/transcript.js dist/daemon-react-sdk.js dist/types/index.d.ts dist/types/transcript.d.ts dist/types/daemon-react-sdk.d.ts; do
            test -f "/tmp/packed-web/package/$target"
          done
          if grep -R -n -E "['\"]@/" /tmp/packed-web/package/dist/types; then
            echo 'repository alias leaked into packed declarations' >&2
            exit 1
          fi
          ln -s /tmp/packed-web/package /tmp/consumer/node_modules/@qwen-code/web-shell
          cd /tmp/consumer
          node --input-type=module - <<'JS'
          for (const specifier of [
            '@qwen-code/web-shell',
            '@qwen-code/web-shell/transcript',
            '@qwen-code/web-shell/daemon-react-sdk',
          ]) {
            const resolved = import.meta.resolve(specifier);
            if (!resolved.startsWith('file:')) throw new Error(`unresolved export: ${specifier}`);
            console.log(specifier, resolved);
          }
          JS

      - name: Run full repository preflight
        shell: bash
        run: |
          set -o pipefail
          npm run preflight 2>&1 | tee /tmp/preflight.log

      - name: Final exact-source audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
